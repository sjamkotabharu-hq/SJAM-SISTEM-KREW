<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">


<title>
SJAM DIGITAL DUTY FORM
</title>


<style>

body{

font-family:Arial,sans-serif;
background:#e8f5e9;
margin:0;

}


.container{

max-width:500px;
margin:auto;
padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 15px #ccc;
margin-top:20px;

}


.logo{

text-align:center;
color:#1565c0;
font-size:22px;
font-weight:bold;

}


button{

width:100%;
padding:15px;
margin-top:15px;
border:none;
border-radius:15px;
background:#1565c0;
color:white;
font-size:16px;

}


.green{

background:#2e7d32;

}


input,select{

width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
box-sizing:border-box;

}


.hide{

display:none;

}


</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="logo">

🚑

<br>

ST JOHN AMBULANS MALAYSIA

<br>

KAWASAN KELANTAN UTARA

</div>


<h2 style="text-align:center">

SJAM DIGITAL DUTY FORM

</h2>


<button onclick="bukaCrew()">

👥 CREW

</button>


<button class="green" onclick="bukaAdmin()">

👨‍💼 ADMIN

</button>


</div>



<div id="paparan"></div>


</div>



<script>
const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbz41kLreglua9XskplXqFbN0j6N8VjAw69BPl6-NGs1EVhzZW-huaoxlT3xLD4lWBjQ/exec";


function bukaCrew(){


document.getElementById("paparan").innerHTML=`

<div class="card">

<h2>
Borang Kehadiran Crew
</h2>


<select>

<option>
Pilih Tugasan Aktif
</option>

<option>
SJAM-KN01-0001
</option>


</select>


<input placeholder="Nama Penuh">


<input placeholder="No Kad Pengenalan">


<input placeholder="Kad ID SJAM">


<label>
Masa Mula Bertugas
</label>

<input type="time">


<label>
Masa Tamat Bertugas
</label>

<input type="time">


<button>

SUBMIT

</button>


</div>


`;

}



function bukaAdmin(){

document.getElementById("paparan").innerHTML=`

<div class="card">

<h2>
👨‍💼 ADMIN LOGIN
</h2>


<input id="username"
placeholder="Username">


<input id="password"
type="password"
placeholder="Password">


<button onclick="loginAdmin()">

LOGIN

</button>


</div>

`;

}




function loginAdmin(){


let data={

action:"adminLogin",

username:
document.getElementById("username").value,

password:
document.getElementById("password").value

};



fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify(data)

})


.then(r=>r.json())

.then(res=>{


if(res.success){


alert("✅ Login berjaya");


adminDashboard();


}

else{


alert("❌ Username / password salah");


}


});


}




function adminDashboard(){


document.getElementById("paparan").innerHTML=`

<div class="card">


<h2>
👨‍💼 ADMIN DASHBOARD
</h2>



<button onclick="createTaskForm()">

➕ CREATE TUGASAN BARU

</button>



</div>


`;

}

function createTaskForm(){


document.getElementById("paparan").innerHTML=`

<div class="card">

<h2>
CREATE TUGASAN
</h2>


<input id="jenis"
placeholder="Jenis Tugasan">


<input id="tarikh"
type="date">


<input id="tempat"
placeholder="Tempat">


<input id="anjuran"
placeholder="Anjuran">


<input id="mula"
type="time">


<input id="tamat"
type="time">


<input id="pendapatan"
placeholder="Pendapatan RM">


<button onclick="saveTask()">

SAVE

</button>


</div>

`;

}



function saveTask(){


let data={

jenis:
document.getElementById("jenis").value,

tarikh:
document.getElementById("tarikh").value,

tempat:
document.getElementById("tempat").value,

anjuran:
document.getElementById("anjuran").value,

mula:
document.getElementById("mula").value,

tamat:
document.getElementById("tamat").value,

pendapatan:
document.getElementById("pendapatan").value

};



fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"createTask",

data:data

})

})


.then(r=>r.json())

.then(res=>{


alert(
"✅ Tugasan berjaya dibuat\nID : "
+res.id
);


});

}

</script>


</body>

</html>
