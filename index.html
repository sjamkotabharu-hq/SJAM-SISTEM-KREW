<script>

// ==============================
// BAHAGIAN 2/10
// JAVASCRIPT SAMBUNGAN
// ==============================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxVa3vay4ol0pH4GgjoZkReRxW--F-mD1J-hUJHUHUQCy1ziMLmRGx9u3vTh0ZW0yKf/exec";

const BANNER_URL =
"https://lh3.googleusercontent.com/d/1cPsr9IwF9IwydvnbG7JwZzfRPCma5fd3";

let currentUser =
JSON.parse(localStorage.getItem("krew")) || null;

let jumlahJadualLama = 0;

let adminSession =
localStorage.getItem("admin") || null;

// ==============================
// AUTO LOGIN
// ==============================

window.onload=function(){

let user =
JSON.parse(localStorage.getItem("krew"));

let admin =
localStorage.getItem("admin");

if(user){

currentUser=user;

if(Notification.permission=="granted" &&
localStorage.getItem("notifAktif")=="YA"){

aktifkanNotifikasiSJAM();

}

if(localStorage.getItem("audioAktif")=="YES"){

aktifkanAudio();

}

document.getElementById("namaKrew").innerHTML =
currentUser.nama.toUpperCase();

document.getElementById("loginPage")
.classList.add("hide");

document.getElementById("daftarPage")
.classList.add("hide");

document.getElementById("menuPage")
.classList.remove("hide");

// Papar menu dahulu
document.getElementById("paparBulanKrew").innerHTML =
"⏳ Semak bulan...";

// Ambil data belakang tab
setTimeout(()=>{

ambilBulanAktif();

kiraJadualBaru();

},100);

}

else if(admin){

bukaDashboardAdmin();

}

};

// ==============================
// AMBIL BULAN AKTIF
// ==============================

function ambilBulanAktif(){

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"bulanAktif"

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

document.getElementById("paparBulanKrew").innerHTML =
res.bulan;

}

});

}

// ==============================
// BUKA DAFTAR
// ==============================

function bukaDaftar(){

document.getElementById("loginPage")
.classList.add("hide");

document.getElementById("daftarPage")
.classList.remove("hide");

}

// ==============================
// KEMBALI LOGIN
// ==============================

function kembaliLogin(){

document.getElementById("daftarPage")
.classList.add("hide");

document.getElementById("loginPage")
.classList.remove("hide");

}

// ==============================
// DAFTAR KREW
// ==============================

function daftarKrew(){

let data={

nama:
document.getElementById("nama").value.trim(),

kp:
document.getElementById("kp").value.trim(),

telefon:
document.getElementById("telefon").value.trim(),

password:
document.getElementById("password").value

};

let password2 =
document.getElementById("password2").value;

if(
!data.nama ||
!data.kp ||
!data.telefon ||
!data.password
){

alert("❌ Sila lengkapkan semua maklumat.");

return;

}

if(data.password!=password2){

alert("❌ Password tidak sama");

return;

}

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"daftar",

data:data

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

alert(
"✅ Pendaftaran berjaya\nID Krew: "+res.id
);

kembaliLogin();

}

else{

alert("❌ Pendaftaran gagal");

}

});

}

// ==============================
// BAHAGIAN 3/10
// LOGIN KREW + BORANG TUNTUTAN
// ==============================

// ==============================
// LOGIN KREW
// ==============================

function loginKrew(){

let kpInput =
document.getElementById("loginKP").value.trim();

let passInput =
document.getElementById("loginPass").value;

if(!kpInput || !passInput){

alert("❌ Sila masukkan No KP dan Password.");

return;

}

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"login",

data:{

kp:kpInput,

password:passInput

}

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

currentUser=res;

localStorage.removeItem("admin");

localStorage.setItem(
"krew",
JSON.stringify(res)
);

document.getElementById("namaKrew").innerHTML =
currentUser.nama.toUpperCase();

document.getElementById("loginPage")
.classList.add("hide");

document.getElementById("daftarPage")
.classList.add("hide");

document.getElementById("menuPage")
.classList.remove("hide");

document.getElementById("content").innerHTML="";

// buka menu dahulu
document.getElementById("paparBulanKrew").innerHTML =
"⏳ Semak bulan...";

// jalan belakang
setTimeout(()=>{

ambilBulanAktif();

kiraJadualBaru();

},100);

if(localStorage.getItem("audioAktif")=="YES"){

aktifkanAudio();

}

}

else{

alert("❌ No KP atau Password salah");

}

})

.catch(error=>{

console.error(error);

alert(
"❌ Sistem tidak dapat dihubungi."
);

});

}

function kadarKrew(){

if(
currentUser &&
currentUser.nama.toUpperCase()=="ABDUL HALIM BIN NORDIN"
){

return {
hari:"13%",
malam:"15%",
cuti:"18%"
};

}

else{

return {
hari:"10%",
malam:"12%",
cuti:"14%"
};

}

}

function paparJenis(jenis){

let kadar = kadarKrew();

if(jenis=="Hari Biasa"){
return "Hari Biasa " + kadar.hari;
}

if(jenis=="Malam Jumaat/Sabtu"){
return "Malam Jumaat/Sabtu " + kadar.malam;
}

if(jenis=="Cuti Umum"){
return "Cuti Umum " + kadar.cuti;
}

return jenis;

}

// ==============================
// BUKA BORANG TUNTUTAN
// ==============================

function bukaBorang(jenis){

document.getElementById("menuPage")
.classList.add("hide");

let kadar = kadarKrew();

let jumlahBox="";
let tambahan="";

if(jenis!="Keluar Negeri"){

jumlahBox=`

<input

id="jumlah"

type="number"

step="0.01"

placeholder="Jumlah RM">

`;

}

if(jenis=="Keluar Negeri"){

tambahan=`

<input

id="destinasi"

placeholder="Destinasi">

<select id="pemandu">

<option value="">

Pemandu Ambulans?

</option>

<option value="YA">

YA

</option>

<option value="TIDAK">

TIDAK

</option>

</select>

`;

}

document.getElementById("content").innerHTML=`

<div class="banner">

<img src="${BANNER_URL}">

</div>

<div class="card">

<h2>

📝 ${paparJenis(jenis)}

</h2>

<div class="settingBox">

📅 Bulan Tuntutan:

<br>

<span id="bulanBorang">

-

</span>

</div>

<input

id="tarikh"

type="date">

<input

id="resit"

placeholder="No Resit">

${jumlahBox}

${tambahan}

<button onclick="hantarTuntutan('${jenis}')">

✅ Sahkan & Hantar

</button>

<button

class="back"

onclick="bukaMenu()">

⬅️ Menu Utama

</button>

</div>

`;

ambilBulanAktifBorang();

}

// ==============================
// PAPAR BULAN DI BORANG
// ==============================

function ambilBulanAktifBorang(){

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"bulanAktif"

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

let box =
document.getElementById("bulanBorang");

if(box){

box.innerHTML=res.bulan;

}

}

});

}

// ==============================
// BAHAGIAN 4/10
// HANTAR TUNTUTAN + MENU KREW
// ==============================

// ==============================
// KEMBALI MENU KREW
// ==============================

function bukaMenu(){

document.getElementById("content").innerHTML="";

document.getElementById("loginPage")
.classList.add("hide");

document.getElementById("daftarPage")
.classList.add("hide");

document.getElementById("menuPage")
.classList.remove("hide");

if(currentUser){

document.getElementById("namaKrew").innerHTML =
currentUser.nama.toUpperCase();

ambilBulanAktif();

kiraJadualBaru();

}

}

function kiraJadualBaru(){

fetch(SCRIPT_URL,{
method:"POST",
body:JSON.stringify({

action:"kiraanJadual",
idKrew:currentUser.id

})

})

.then(r=>r.json())

.then(res=>{

document.getElementById("badgeJadual").innerHTML =
res.jumlah;

if(res.jumlah > jumlahJadualLama){

testSiren();

}

jumlahJadualLama = res.jumlah;

});

}

// ==============================
// HANTAR TUNTUTAN
// ==============================

function hantarTuntutan(jenis){

let jumlah="";

if(jenis!="Keluar Negeri"){

jumlah =
document.getElementById("jumlah").value;

}

let data={

idKrew:
currentUser.id,

nama:
currentUser.nama,

jenis:
paparJenis(jenis),

tarikh:
document.getElementById("tarikh").value,

resit:
document.getElementById("resit").value,

jumlah:
jumlah,

destinasi:
document.getElementById("destinasi")
?
document.getElementById("destinasi").value
:
"",

pemandu:
document.getElementById("pemandu")
?
document.getElementById("pemandu").value
:
""

};

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"tuntutan",

data:data

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

alert("✅ Tuntutan berjaya dihantar");

bukaMenu();

}

else{

alert("❌ Tuntutan gagal dihantar");

}

})

.catch(error=>{

console.error(error);

alert(
"❌ Sistem tidak dapat dihubungi."
);

});

}

// ==============================
// SEJARAH KREW
// ==============================

function lihatSejarah(){

document.getElementById("menuPage")
.classList.add("hide");

document.getElementById("content").innerHTML = `

<div class="banner">

<img src="${BANNER_URL}">

</div>

<div class="card">

<h2>📚 Sejarah Saya</h2>

<div class="settingBox">

⏳ Sedang menyemak sejarah tugasan anda...<br>
Sila tunggu sebentar.

</div>

</div>

`;

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"sejarah",

idKrew:currentUser.id

})

})

.then(r=>r.json())

.then(data=>{

let html=`

<div class="banner">

<img src="${BANNER_URL}">

</div>

<div class="card">

<h2>

📚 Sejarah Saya

</h2>

`;

data.forEach(x=>{

html+=`

<div class="laporanItem">

<b>

${x.jenis}

</b>

<br>

📅 Tarikh:

${formatTarikh(x.tarikh)}

<br>

🧾 No Resit:

${x.resit}

<br>

${x.jumlah?

"💰 RM "+x.jumlah

:

""

}

<br>

${x.destinasi?

"🗺️ Destinasi: "+x.destinasi

:

""

}

</div>

`;

});

html+=`

<button

class="back"

onclick="bukaMenu()">

⬅️ Menu Utama

</button>

</div>

`;

document.getElementById("content").innerHTML=html;

})

.catch(error=>{

console.error(error);

document.getElementById("content").innerHTML += `

<div class="settingBox" style="color:red">

❌ Gagal mengambil sejarah tugasan.

// ==============================
// JADUAL TUGASAN KREW
// ==============================

function lihatJadualKrew(){

document.getElementById("menuPage")
.classList.add("hide");

document.getElementById("content").innerHTML = `

<div class="banner">

<img src="${BANNER_URL}">

</div>

<div class="card">

<h2>🚑 Jadual Tugasan Saya</h2>

<div class="settingBox">

⏳ Sedang menyemak jadual tugasan...<br>
Sila tunggu sebentar.

</div>

</div>

`;

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"jadualKrew",

idKrew:currentUser.id

})

})

.then(r=>r.json())

.then(res=>{

let html=`

<div class="banner">

<img src="${BANNER_URL}">

</div>

<div class="card">

<h2>🚑 Jadual Tugasan Saya</h2>

`;

if(!res.data || res.data.length===0){

html+=`

<div class="settingBox">

Tiada tugasan ambulans untuk anda buat masa ini.

</div>

`;

}

else{

res.data.forEach(x=>{

html+=`

<div class="krewBox">

<b>🚑 ${x.kes}</b>

<br>

📅 Tarikh:
${formatTarikh(x.tarikh)}

<br>

📍 Lokasi:
${x.lokasi || "-"}

<br>

🏥 Destinasi:
${x.destinasi || "-"}

<br>

⏰ Masa:
${x.masa || "-"}

<br>

🚑 Ambulans:
${x.ambulans || "-"}

<br>

💰 Bayaran:
RM ${x.bayaran || "-"}

<br>

🍩 Donut & Air:
${x.makan || "-"}

<br>

👥 Krew Bertugas:
${x.krewNama || "-"}

<br>



🆘 Krew Backup:
${x.krewBackup || "-"}

<br>

📌 Status:
<span style="
color:${x.status=="TERIMA"?"green":x.status=="TOLAK"?"red":"orange"};
font-weight:bold;
">
${x.status || "BARU"}
</span>

<br><br>

${
x.status=="BARU"
?
`
<button 
class="green"
onclick="sahkanJadual('${x.idJadual}')">

✅ TERIMA TUGASAN

</button>

<button 
class="red"
onclick="tolakJadual('${x.idJadual}')">

❌ TOLAK TUGASAN

</button>
`
:
""
}

</div>

`;

});

}

html+=`

<button
class="back"
onclick="bukaMenu()">

⬅️ Menu Utama

</button>

</div>

`;

document.getElementById("content").innerHTML=html;

})

.catch(error=>{

console.error(error);

alert("❌ Tidak dapat membuka jadual tugasan.");

bukaMenu();

});

}

// ==============================
// SAHKAN JADUAL TUGASAN KREW
// ==============================

function sahkanJadual(idJadual){

if(!confirm("Terima tugasan ini?")){
return;
}

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"sahkanJadual",

idJadual:idJadual,

idKrew:currentUser.id,

namaKrew:currentUser.nama

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

alert("✅ Tugasan berjaya diterima");

lihatJadualKrew();

}

else{

alert("❌ Gagal sahkan tugasan");

}

})

.catch(error=>{

console.error(error);

alert("❌ Sistem tidak dapat dihubungi");

});

}

// ==============================
// TOLAK JADUAL TUGASAN KREW
// ==============================

function tolakJadual(idJadual){

if(!confirm("Tolak tugasan ini?")){
return;
}

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"tolakJadual",

idJadual:idJadual,

idKrew:currentUser.id,

namaKrew:currentUser.nama

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

alert("❌ Tugasan berjaya ditolak");

lihatJadualKrew();

}

else{

alert("❌ Gagal menolak tugasan");

}

})

.catch(error=>{

console.error(error);

alert("❌ Sistem tidak dapat dihubungi");

});

}

function adminLogin(){

prompt("Username Admin");

prompt("Password Admin");

method:"POST",

body:JSON.stringify({

username:username,

password:password

})

})

.then(r=>r.json())

.then(res=>{

"admin",

);

);

function simpanJadual(){

let tarikh =
document.getElementById("jadualTarikh").value;

for(let i=1; i<=jumlahKes; i++){

let checkbox =
document.querySelectorAll(
'input[name="krew'+i+'"]:checked'
);

let krewTag = [];
let krewNama = [];

checkbox.forEach(function(k){

let data = k.value.split("|");

krewTag.push(data[0]);

krewNama.push(data[1]);

});

// ==============================
// AMBIL KREW BACKUP
// ==============================

let backupCheckbox =
document.querySelectorAll(
'input[name="backup'+i+'"]:checked'
);

let backupTag = [];
let backupNama = [];

backupCheckbox.forEach(function(k){

let data = k.value.split("|");

backupTag.push(data[0]);

backupNama.push(data[1]);

});

let data={

tarikh: tarikh,

kes: "KES "+i,

lokasi:
document.getElementById("lokasi"+i).value,

destinasi:
document.getElementById("destinasi"+i).value,

krew:
krewTag.join(","),

krewNama:
krewNama.join(","),

krewBackup:
backupNama.join(","),

masa:
document.getElementById("masa"+i).value,

remark:
document.getElementById("remark"+i).value,

ambulans:
document.getElementById("ambulans"+i).value,

bayaran:
document.getElementById("bayaran"+i).value,

makan:
document.getElementById("makan"+i).value,

};

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"simpanJadual",

data:data

})

});

}

alert("✅ Semua jadual berjaya disimpan");

}

// ==============================
// FORMAT TARIKH
// ==============================

function formatTarikh(tarikh){

let d = new Date(tarikh);

if(isNaN(d)){

return tarikh;

}

return String(d.getDate()).padStart(2,'0')

+

"/"

+

String(d.getMonth()+1).padStart(2,'0')

+

"/"

+

d.getFullYear();

}

let audioCtxGlobal = null;

function aktifkanAudio(){

if(!audioCtxGlobal){

audioCtxGlobal =
new (window.AudioContext || window.webkitAudioContext)();

}

if(audioCtxGlobal.state==="suspended"){

audioCtxGlobal.resume();

}

}

// ==============================
// TEST SIREN
// ==============================

function testSiren(){

let audioCtx = audioCtxGlobal;

if(!audioCtx){

return;

}

let startTime = audioCtx.currentTime;

function beep(time, frequency){

let osc = audioCtx.createOscillator();

let gain = audioCtx.createGain();

osc.type = "square";

osc.frequency.value = frequency;

gain.gain.value = 0.3;

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start(time);

osc.stop(time + 0.25);

}

for(let i=0;i<20;i++){

let time = startTime + (i * 0.25);

let freq = (i % 2 === 0) ? 900 : 500;

beep(time,freq);

}

}

function formatMasa(masa){

let d = new Date(masa);

if(isNaN(d)){
return masa;
}

d.setHours(d.getHours()+8);

return d.getFullYear()
+"-"+String(d.getMonth()+1).padStart(2,'0')
+"-"+String(d.getDate()).padStart(2,'0')
+" "
+String(d.getHours()%12 || 12).padStart(2,'0')
+":"
+String(d.getMinutes()).padStart(2,'0')
+(d.getHours()>=12 ? "pm" : "am");

}
