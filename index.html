<script>

// ==============================
// BAHAGIAN 2/10
// JAVASCRIPT SAMBUNGAN
// ==============================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxVa3vay4ol0pH4GgjoZkReRxW--F-mD1J-hUJHUHUQCy1ziMLmRGx9u3vTh0ZW0yKf/exec";

const BANNER_URL =
"https://lh3.googleusercontent.com/d/1cPsr9IwF9IwydvnbG7JwZzfRPCma5fd3";

let currentUser =
JSON.parse(localStorage.getItem("krew")) || null;

let jumlahJadualLama = 0;

let adminSession =
localStorage.getItem("admin") || null;

// ==============================
// AUTO LOGIN
// ==============================


window.onload = function(){

  // =================================
  // AMBIL DATA LOGIN TERSIMPAN
  // =================================

  let user = JSON.parse(
    localStorage.getItem("krew")
  );

  let admin = localStorage.getItem(
    "tokenAdminSJAM"
  );


  // =================================
  // KEUTAMAAN PERTAMA: ADMIN
  // =================================

  if(admin){

    // Sembunyikan halaman login sementara
    document.getElementById("loginPage")
      .classList.add("hide");

    document.getElementById("daftarPage")
      .classList.add("hide");

    document.getElementById("menuPage")
      .classList.add("hide");

    document.getElementById("content").innerHTML = `
      <div class="card">
        <h2>👨‍💼 Admin SJAM</h2>
        <div class="settingBox">
          ⏳ Sedang mengesahkan sesi Admin...
        </div>
      </div>
    `;

    fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"semakSesiAdminSJAM",

        tokenAdmin:admin

      })

    })

    .then(r=>r.json())

    .then(res=>{

      if(res.success){

        // ADMIN MASIH SAH
        currentUser = null;

        bukaDashboardAdmin();

      }else{

        // TOKEN TIDAK SAH
        localStorage.removeItem(
          "tokenAdminSJAM"
        );

        localStorage.removeItem("admin");

        document.getElementById("content").innerHTML = "";

        document.getElementById("loginPage")
          .classList.remove("hide");

        alert(
          "Sesi Admin tidak sah. Sila login semula."
        );

      }

    })

    .catch(error=>{

      console.error(error);

      // JANGAN PADAM TOKEN JIKA INTERNET TERPUTUS
      document.getElementById("content").innerHTML = `

        <div class="card">

          <h2>⚠️ Sambungan Admin</h2>

          <div class="settingBox">
            Tidak dapat menghubungi Google Apps Script.
            <br><br>
            Sesi Admin masih disimpan.
          </div>

          <button onclick="window.location.reload()">
            🔄 CUBA SEMULA
          </button>

        </div>

      `;

    });

    return;

  }


  // =================================
  // KEUTAMAAN KEDUA: KREW
  // =================================

  if(user){

    currentUser = user;

    if(
      Notification.permission=="granted" &&
      localStorage.getItem("notifAktif")=="YA"
    ){

      autoSimpanTokenSJAM();

    }

    if(
      localStorage.getItem("audioAktif")=="YES"
    ){

      aktifkanAudio();

    }

    document.getElementById("namaKrew").innerHTML =
      currentUser.nama.toUpperCase();

    document.getElementById("loginPage")
      .classList.add("hide");

    document.getElementById("daftarPage")
      .classList.add("hide");

    document.getElementById("menuPage")
      .classList.remove("hide");

    updateKadarMenu();

    document.getElementById("content").innerHTML = "";

    document.getElementById("paparBulanKrew").innerHTML =
      "⏳ Semak bulan...";

    setTimeout(()=>{

      ambilBulanAktif();

      kiraJadualBaru();

    },100);

    return;

  }


  // =================================
  // TIADA ADMIN ATAU KREW LOGIN
  // =================================

  document.getElementById("loginPage")
    .classList.remove("hide");

  document.getElementById("daftarPage")
    .classList.add("hide");

  document.getElementById("menuPage")
    .classList.add("hide");

  document.getElementById("content").innerHTML = "";

};


// ==============================
// AMBIL BULAN AKTIF
// ==============================

function ambilBulanAktif(){

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"bulanAktif"

})

})

.then(r=>r.json())

.then(res=>{

}

});

}

// ==============================
// KEMBALI LOGIN

function kembaliLogin(){

document.getElementById("daftarPage")
.classList.add("hide");

document.getElementById("loginPage")
.classList.remove("hide");

}

// ==============================
// DAFTAR KREW
// ==============================

function daftarKrew(){

let data={

nama:
document.getElementById("nama").value.trim(),

kp:
document.getElementById("kp").value.trim(),

telefon:
document.getElementById("telefon").value.trim(),

password:
document.getElementById("password").value

};

let password2 =
document.getElementById("password2").value;

if(
!data.nama ||
!data.kp ||
!data.telefon ||
!data.password
){

alert("❌ Sila lengkapkan semua maklumat.");

return;

}

if(data.password!=password2){

alert("❌ Password tidak sama");

return;

}

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"daftar",

data:data

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

alert(
"✅ Pendaftaran berjaya\nID Krew: "+res.id
);

kembaliLogin();

}

else{

alert("❌ Pendaftaran gagal");

}

});

}

// BAHAGIAN 3/10
// LOGIN KREW + BORANG TUNTUTAN
// ==============================

// ==============================
// LOGIN KREW
// ==============================

function loginKrew(){

let kpInput =
document.getElementById("loginKP").value.trim();

let passInput =
document.getElementById("loginPass").value;

if(!kpInput || !passInput){

alert("❌ Sila masukkan No KP dan Password.");

return;

}

fetch(SCRIPT_URL,{

method:"POST",

body:JSON.stringify({

action:"login",

data:{

kp:kpInput,

password:passInput

}

})

})

.then(r=>r.json())

.then(res=>{

if(res.success){

currentUser=res;

localStorage.removeItem("admin");

localStorage.setItem(
"krew",
JSON.stringify(res)
);

document.getElementById("namaKrew").innerHTML =
currentUser.nama.toUpperCase();

document.getElementById("loginPage")
.classList.add("hide");

document.getElementById("daftarPage")
.classList.add("hide");

document.getElementById("menuPage")
.classList.remove("hide");

document.getElementById("content").innerHTML="";

// buka menu dahulu
document.getElementById("paparBulanKrew").innerHTML =
"⏳ Semak bulan...";

// jalan belakang
setTimeout(()=>{

ambilBulanAktif();

kiraJadualBaru();

},100);

if(localStorage.getItem("audioAktif")=="YES"){

aktifkanAudio();

}

}

else{

alert("❌ No KP atau Password salah");

}

})

.catch(error=>{

console.error(error);

alert(
"❌ Sistem tidak dapat dihubungi."
);

});

}

function kadarKrew(){

if(
currentUser &&
currentUser.nama.toUpperCase()=="ABDUL HALIM BIN NORDIN"
){

return {
hari:"13%",
malam:"15%",
cuti:"18%"
};

}

else{

return {
hari:"10%",
malam:"12%",
cuti:"14%"
};

}

}

function kadarNamaKrew(nama){

if(
nama &&
nama.toUpperCase()=="ABDUL HALIM BIN NORDIN"
){

return {
hari:"13%",
malam:"15%",
cuti:"18%"
};

}

return {
hari:"10%",
malam:"12%",
cuti:"14%"
};

}

function updateKadarMenu(){

let kadar = kadarKrew();

let hari = document.getElementById("menuHari");
let malam = document.getElementById("menuMalam");
let cuti = document.getElementById("menuCuti");


if(hari){
hari.innerHTML = kadar.hari;
}

if(malam){
malam.innerHTML = kadar.malam;
}

if(cuti){
cuti.innerHTML = kadar.cuti;
}

}

function paparJenis(jenis){

let kadar = kadarKrew();


if(jenis=="Hari Biasa"){
return "Hari Biasa " + kadar.hari;
}

if(jenis=="Malam Jumaat/Sabtu"){
return "Malam Jumaat/Sabtu " + kadar.malam;
}

if(jenis=="Cuti Umum"){
return "Cuti Umum " + kadar.cuti;
}

return jenis;

}

// FIX PAPAR KADAR LAPORAN
function formatJenisLaporan(jenis,nama){

let kadar = kadarNamaKrew(nama);

if(jenis.includes("Hari Biasa")){
return "Hari Biasa " + kadar.hari;
}

if(jenis.includes("Malam Jumaat/Sabtu")){
return "Malam Jumaat/Sabtu " + kadar.malam;
}

if(jenis.includes("Cuti Umum")){
return "Cuti Umum " + kadar.cuti;
}

return jenis;

}

if(jenis!="Keluar Negeri"){

jumlahBox=`

// ==============================
// TUKAR JUMLAH RM KEPADA PERKATAAN
// ==============================

function nomborKePerkataanSJAM(n){

const unit = [
"Kosong","Satu","Dua","Tiga","Empat",
"Lima","Enam","Tujuh","Lapan","Sembilan"
];

function kecil(x){

if(x<10) return unit[x];

if(x===10) return "Sepuluh";

if(x===11) return "Sebelas";

if(x<20){
return unit[x-10]+" Belas";
}

if(x<100){
return unit[Math.floor(x/10)]+" Puluh"+
(x%10 ? " "+kecil(x%10) : "");
}

if(x<1000){
return unit[Math.floor(x/100)]+" Ratus"+
(x%100 ? " "+kecil(x%100) : "");
}

return "";

}

function besar(x){

if(x<1000) return kecil(x);

if(x<1000000){

return (
Math.floor(x/1000)===1
? "Seribu"
: besar(Math.floor(x/1000))+" Ribu"
)+
(x%1000 ? " "+kecil(x%1000) : "");

}

return besar(Math.floor(x/1000000))+
" Juta"+
(x%1000000 ? " "+besar(x%1000000) : "");

}

if(n==="" || n===null || n===undefined){
return "";
}

const nilai=Number(n);

if(!Number.isFinite(nilai) ||
nilai<0 ||
nilai>=1000000000){
return "";
}

const senKeseluruhan=Math.round(nilai*100);

const ringgit=Math.floor(senKeseluruhan/100);

const sen=senKeseluruhan%100;

return besar(ringgit)+" Ringgit"+
(sen ? " dan "+kecil(sen)+" Sen" : "")+
" Sahaja";

}

function adminLogin(){

  const username = prompt("Username Admin");

  if(username === null){
    return;
  }

  const password = prompt("Password Admin");

  if(password === null){
    return;
  }

  if(!username.trim() || !password){

    alert("❌ Sila isi username dan password.");
    return;

  }

  fetch(SCRIPT_URL,{

    method:"POST",

    body:JSON.stringify({

      action:"admin",
      username:username.trim(),
      password:password

    })

  })

  .then(async response=>{

    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }

    return await response.json();

  })

  .then(res=>{

    // Jangan paparkan token atau maklumat sulit
    console.log("Status login admin:", {
      success:res.success,
      adaToken:!!res.tokenAdmin,
      message:res.message || ""
    });

    if(res.success === true && res.tokenAdmin){

      localStorage.setItem(
        "tokenAdminSJAM",
        res.tokenAdmin
      );

      localStorage.removeItem("admin");
      localStorage.removeItem("krew");

      currentUser = null;

      bukaDashboardAdmin();

      return;

    }

    if(res.success === true && !res.tokenAdmin){

      alert(
        "❌ Username dan password mungkin telah " +
        "disahkan oleh GS, tetapi token sesi admin " +
        "tidak diterima.\n\n" +
        "Sila semak fungsi login admin dalam kod GS."
      );

      return;

    }

    alert(
      "❌ Login Admin gagal.\n\n" +
      "Maklum balas GS: " +
      (res.message || "Pengesahan ditolak.")
    );

  })

  .catch(error=>{

    console.error("Ralat login admin:",error);

    alert(
      "❌ Ralat sambungan atau respons GS.\n\n" +
      error.message
    );

  });

}

async function paparStatistikOperasi(){

window.laporanStatistikSJAM = null;

  const token = localStorage.getItem("tokenAdminSJAM");

  if(!token){
    alert("Sesi admin tamat. Sila login semula.");
    return;
  }

  const jenisLaporan = document.getElementById(
    "jenisLaporanStatistikSJAM"
  ).value;

  const tahun = Number(document.getElementById(
    "tahunStatistikSJAM"
  ).value);

  const bulan = Number(document.getElementById(
    "bulanStatistikSJAM"
  ).value);

  const graf = document.getElementById("statGraf");
  const analisis = document.getElementById("statAnalisis");

  const ids = [
    "statJumlahKes",
    "statDiscaj",
    "statPindah",
    "statTCA",
    "statMasukWad"
  ];

  ids.forEach(id => {
    document.getElementById(id).textContent = "—";
  });

  graf.textContent = "⏳ Sedang mengambil data statistik...";
  analisis.textContent = "Sedang menjana analisis operasi...";

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"statistikOperasiSJAM",
        tokenAdmin:token,
        jenisLaporan:jenisLaporan,
        tahun:tahun,
        bulan:bulan

      })

    });

    const res = await response.json();

    if(!res.success){
      throw new Error(
        res.message || "Gagal mengambil statistik."
      );
    }

    document.getElementById("statJumlahKes")
      .textContent = res.jumlahKes;

    document.getElementById("statDiscaj")
      .textContent = res.discaj;

    document.getElementById("statPindah")
      .textContent = res.pindah;

    document.getElementById("statTCA")
      .textContent = res.tca;

    document.getElementById("statMasukWad")
      .textContent = res.masuk;

    paparGrafStatistikSJAM(res);

    paparAnalisisStatistikSJAM(res);
window.laporanStatistikSJAM = res;
  }catch(error){

    graf.textContent = "❌ Gagal mengambil statistik.";
    analisis.textContent = error.message;

    alert(error.message);

  }

}

// GRAF STATISTIK OPERASI SJAM

function paparGrafStatistikSJAM(res){

  const graf = document.getElementById("statGraf");

  const jumlah = Number(res.jumlahKes) || 0;

  const kategori = [
    ["Discaj Wad", res.discaj, "#1565c0"],
    ["Pindah Hospital", res.pindah, "#7b1fa2"],
    ["Temujanji (TCA)", res.tca, "#2e7d32"],
    ["Masuk Wad", res.masuk, "#ef6c00"],
    ["Lain-lain", res.lain, "#607d8b"],
    ["Konflik Kategori", res.konflik, "#c62828"]
  ];

  let html = "";

  kategori.forEach(function(item){

    const bilangan = Number(item[1]) || 0;

    const peratus = jumlah > 0
      ? (bilangan / jumlah * 100).toFixed(1)
      : "0.0";

    html += `
      <div style="margin-bottom:18px;text-align:left;">

        <div style="
          display:flex;
          justify-content:space-between;
          font-size:13px;
          margin-bottom:6px;
        ">
          <b>${item[0]}</b>
          <b>${bilangan} (${peratus}%)</b>
        </div>

        <div style="
          background:#eeeeee;
          height:18px;
          border-radius:8px;
          overflow:hidden;
        ">

          <div style="
            width:${peratus}%;
            height:100%;
            background:${item[2]};
            border-radius:8px;
          "></div>

        </div>

      </div>
    `;

  });

  if(res.jenisLaporan === "tahunan"){

    const namaBulan = [
      "Jan","Feb","Mac","Apr",
      "Mei","Jun","Jul","Ogos",
      "Sep","Okt","Nov","Dis"
    ];

    const trend = Array.isArray(res.trendBulanan)
      ? res.trendBulanan : Array(12).fill(0);

    const maksimum = Math.max(1,...trend);

    html += `
      <hr>
      <h3>📈 Trend Operasi Tahunan</h3>
    `;

    namaBulan.forEach(function(nama,i){

      const nilai = Number(trend[i]) || 0;
      const lebar = nilai / maksimum * 100;

      html += `
        <div style="
          display:flex;
          align-items:center;
          gap:8px;
          margin:10px 0;
          font-size:12px;
        ">

          <b style="width:35px;">${nama}</b>

          <div style="
            flex:1;
            background:#eeeeee;
            border-radius:6px;
            height:16px;
            overflow:hidden;
          ">

            <div style="
              background:#ef6c00;
              width:${lebar}%;
              height:100%;
            "></div>

          </div>

          <b>${nilai}</b>

        </div>
      `;

    });

  }

  graf.innerHTML = html;

}

// TAMAT GRAF STATISTIK OPERASI

// ANALISIS AUTOMATIK OPERASI SJAM
// ============================================

function paparAnalisisStatistikSJAM(res){

  const analisis = document.getElementById(
    "statAnalisis"
  );

  const jumlah = Number(res.jumlahKes) || 0;

  const namaBulan = [
    "Januari","Februari","Mac","April",
    "Mei","Jun","Julai","Ogos",
    "September","Oktober","November","Disember"
  ];

  const kategori = [
    ["Discaj Wad", Number(res.discaj) || 0],
    ["Pindah Hospital", Number(res.pindah) || 0],
    ["Temujanji (TCA)", Number(res.tca) || 0],
    ["Masuk Wad", Number(res.masuk) || 0]
  ];

  const tempoh = res.jenisLaporan === "tahunan"
    ? "Tahun " + Number(res.tahun)
    : namaBulan[Number(res.bulan)-1] + " " +
      Number(res.tahun);

  let html = `
    <div style="text-align:left;line-height:1.7;">

    <h3>📋 Ringkasan Laporan</h3>

    <b>Tempoh:</b> ${tempoh}<br>

    <b>Jumlah operasi:</b> ${jumlah} kes<br>

    <b>Jumlah rekod tuntutan:</b>
    ${Number(res.jumlahRekod) || 0}<br>

    <b>Rekod berulang ditapis:</b>
    ${Number(res.pendua) || 0}<br>

    <hr>
  `;

  if(jumlah === 0){

    html += `
      <p>Tiada kes dengan nombor resit sah
      direkodkan bagi tempoh yang dipilih.</p>
    `;

  }else{

    const tertinggi = Math.max(
      ...kategori.map(item => item[1])
    );

    if(tertinggi > 0){

      const namaTertinggi = kategori
        .filter(item => item[1] === tertinggi)
        .map(item => item[0])
        .join(", ");

      const peratus = (
        tertinggi / jumlah * 100
      ).toFixed(1);

      html += `
        <h3>🏆 Kategori Kes Tertinggi</h3>

        <b>${namaTertinggi}</b><br>

        ${tertinggi} kes bagi setiap kategori
        tertinggi (${peratus}% setiap kategori).

        <hr>
      `;

    }

    html += `<h3>📊 Pecahan Operasi</h3>`;

    kategori.forEach(function(item){

      const peratus = (
        item[1] / jumlah * 100
      ).toFixed(1);

      html += `
        ${item[0]}:
        <b>${item[1]} kes (${peratus}%)</b><br>
      `;

    });

    if(res.jenisLaporan === "tahunan"){

      const trend = Array.isArray(res.trendBulanan)
        ? res.trendBulanan.map(v => Number(v) || 0)
        : [];

      const maksimum = Math.max(0,...trend);

      if(maksimum > 0){

        const bulanAktif = namaBulan
          .filter((nama,i) => trend[i] === maksimum)
          .join(", ");

        html += `
          <hr>

          <h3>📈 Bulan Paling Aktif</h3>

          <b>${bulanAktif}</b><br>

          ${maksimum} kes bagi setiap bulan tersebut.
        `;

      }

    }

  }

  html += `
    <hr>

    <h3>🔍 Semakan Kualiti Data</h3>

    Rekod tanpa nombor resit:
    <b>${Number(res.resitKosong) || 0}</b><br>

    Kes lain-lain:
    <b>${Number(res.lain) || 0}</b><br>

    Kes konflik kategori:
    <b>${Number(res.konflik) || 0}</b><br>

    Rekod tarikh tidak sah (seluruh sheet):
    <b>${Number(res.tarikhTidakSah) || 0}</b><br>

    <hr>

    <small>
      Statistik dijana berdasarkan nombor resit
      dan tarikh operasi yang unik.
      Tuntutan krew berulang bagi resit dan
      tarikh yang sama dikira sebagai satu kes.
    </small>

    </div>
  `;

  analisis.innerHTML = html;

}

function cetakStatistikSJAM(){

  const res = window.laporanStatistikSJAM;

  if(!res || !res.success){
    alert("Sila papar statistik terlebih dahulu.");
    return;
  }

  const jenis = document.getElementById(
    "jenisLaporanStatistikSJAM"
  ).value;

  const tahun = Number(document.getElementById(
    "tahunStatistikSJAM"
  ).value);

  const bulan = Number(document.getElementById(
    "bulanStatistikSJAM"
  ).value);

  if(res.jenisLaporan !== jenis ||
     res.tahun !== tahun ||
     (jenis === "bulanan" && res.bulan !== bulan)){
    alert("Pilihan laporan telah berubah. Sila papar statistik semula.");
    return;
  }

  const namaBulan = [
    "Januari","Februari","Mac","April",
    "Mei","Jun","Julai","Ogos",
    "September","Oktober","November","Disember"
  ];

  const tempoh = res.jenisLaporan === "tahunan"
    ? String(res.tahun)
    : namaBulan[res.bulan-1] + " " + res.tahun;

  const graf = document.getElementById("statGraf");
  const analisis = document.getElementById("statAnalisis");

  const laporan = window.open("", "_blank");

  if(!laporan){
    alert("Sila benarkan pop-up untuk mencetak laporan.");
    return;
  }

  laporan.document.write(`
    <!DOCTYPE html>
    <html lang="ms">
    <head>
    <meta charset="UTF-8">
    <title>Laporan Operasi SJAM ${tempoh}</title>

    <style>
      @page{
        size:A4;
        margin:15mm;
      }

      body{
        font-family:Arial,sans-serif;
        color:#222;
        padding:15px;
        font-size:13px;
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
      }

      h1,h2,h3{
        text-align:center;
      }

      table{
        width:100%;
        border-collapse:collapse;
        margin:20px 0;
      }

      th,td{
        border:1px solid #ccc;
        padding:10px;
      }

      th{
        background:#EF6C00;
        color:white;
      }

      .jumlah{
        background:#FFF3E0;
        font-weight:bold;
      }

      .footer{
        margin-top:30px;
        font-size:11px;
        color:#666;
        text-align:center;
      }
    </style>
    </head>

    <body>

    <h2>ST. JOHN AMBULANCE OF MALAYSIA</h2>
    <h3>KAWASAN KELANTAN UTARA</h3>

    <hr>

    <h2>STATISTIK & ANALISIS OPERASI AMBULANS</h2>

    <h3>${tempoh}</h3>

    <table>
      <tr>
        <th>Kategori Operasi</th>
        <th>Jumlah Kes</th>
      </tr>
      <tr><td>Discaj Wad</td><td>${res.discaj}</td></tr>
      <tr><td>Pindah Hospital</td><td>${res.pindah}</td></tr>
      <tr><td>Temujanji (TCA)</td><td>${res.tca}</td></tr>
      <tr><td>Masuk Wad</td><td>${res.masuk}</td></tr>
      <tr><td>Lain-lain</td><td>${res.lain}</td></tr>
      <tr><td>Konflik Kategori</td><td>${res.konflik}</td></tr>
      <tr class="jumlah">

    ${graf.innerHTML}

      Tarikh cetakan: ${new Date().toLocaleDateString("ms-MY")}

    </div>

  laporan.document.close();

}

let jumlahKesBaharuSJAM = 0;

function padankanHariJadualSJAM(){

  const input =
    document.getElementById("tarikhJadualSJAM");

  const hari =
    document.getElementById("hariJadualSJAM");

  if(!input.value){
    hari.value = "";
    return;
  }

  const namaHari = [
    "Ahad","Isnin","Selasa","Rabu",
    "Khamis","Jumaat","Sabtu"
  ];

  const pecahan = input.value.split("-").map(Number);

  const tarikh = new Date(
    pecahan[0],
    pecahan[1]-1,
    pecahan[2]
  );

  hari.value = namaHari[tarikh.getDay()];

}

function pilihanKrewBaharuSJAM(namaInput){

  return senaraiNamaKrewBaharuSJAM.map(k=>{

    return `
      <label class="krewCheck">
        <input
          type="checkbox"
          name="${selamatAtributTuntutan(namaInput)}"
          value="${selamatAtributTuntutan(k.id)}"
          data-nama="${selamatAtributTuntutan(k.nama)}"
        >
        <span>${selamatAtributTuntutan(k.nama)}</span>
      </label>
    `;

  }).join("");

}

function isiPilihanKrewBaharuSJAM(){

  const kumpulan = [
    ["hotspotPagiSJAM","hotspotPagi"],
    ["hotspotPetangSJAM","hotspotPetang"],
    ["hotspotMalamSJAM","hotspotMalam"]
  ];

  kumpulan.forEach(([id,nama])=>{

    const box = document.getElementById(id);

    if(box){
      box.innerHTML =
        pilihanKrewBaharuSJAM(nama) ||
        "Tiada krew tersedia.";
    }

  });

  document.querySelectorAll(
    ".krewKesBaharuSJAM"
  ).forEach(box=>{

    const nombor = box.dataset.kes;

    box.innerHTML =
      pilihanKrewBaharuSJAM("krewKes"+nombor);

  });

}

function ambilKrewJadualBaharuSJAM(){

  fetch(SCRIPT_URL,{

    method:"POST",

    body:JSON.stringify({
      action:"senaraiKrew"
    })

  })

  .then(r=>r.json())

  .then(data=>{

    if(!Array.isArray(data)){
      throw new Error("Format senarai krew tidak sah.");
    }

    
    senaraiNamaKrewBaharuSJAM = data;

    isiPilihanKrewBaharuSJAM();

    // Isi semula pilihan krew apabila mod EDIT
    if(window.rekodEditJadualSJAM){

      isiSemulaJadualEditSJAM(
        window.rekodEditJadualSJAM
      );

    }


  })

  .catch(error=>{

    console.error(error);

    ["hotspotPagiSJAM",
     "hotspotPetangSJAM",
     "hotspotMalamSJAM"].forEach(id=>{

      const box = document.getElementById(id);

      if(box){
        box.textContent =
          "Gagal memuatkan senarai krew.";
      }

    });

  });

}

function buangKesBaharuSJAM(n){

  const semua =
    document.querySelectorAll(".kesBaharuSJAM");

  if(semua.length <= 1){

    alert("Sekurang-kurangnya satu kes perlu ada.");
    return;

  }

  const kes = document.querySelector(
    '.kesBaharuSJAM[data-kes="'+n+'"]'
  );

  if(kes && confirm("Buang kes ini daripada borang?")){
    kes.remove();
  }

}

function namaKrewDipilihSJAM(nama){

  return [...document.querySelectorAll(
    'input[name="'+nama+'"]:checked'
  )].map(x=>x.dataset.nama);

}

function kumpulJadualBaharuSJAM(){

  const baca = id =>
    document.getElementById(id)?.value.trim() || "";

  const kes = [...document.querySelectorAll(
    ".kesBaharuSJAM"
  )].map(box=>{

    const n = box.dataset.kes;

    return {

      masa:baca("masaKesSJAM"+n),

      krew:namaKrewDipilihSJAM("krewKes"+n),

      pesakit:baca("pesakitKesSJAM"+n),

      dari:baca("dariKesSJAM"+n),

      ke:baca("keKesSJAM"+n),

      tujuan:baca("tujuanKesSJAM"+n),

      ambulans:baca("ambulansKesSJAM"+n),

      harga:baca("hargaKesSJAM"+n),

      donat:baca("donatKesSJAM"+n)

    };

  });

  return {

    hari:baca("hariJadualSJAM"),

    tarikh:baca("tarikhJadualSJAM"),

    hotspot:{

      pagi:namaKrewDipilihSJAM("hotspotPagi"),

      petang:namaKrewDipilihSJAM("hotspotPetang"),

      malam:namaKrewDipilihSJAM("hotspotMalam")

    },

    kes:kes

  };

}

function formatJumlahKategori(data){

return {

nama:data.nama || "",

bulan:data.bulan || "",

jumlahHariBiasa:data.jumlahHariBiasa || 0,

jumlahMalam:data.jumlahMalam || 0,

jumlahCutiUmum:data.jumlahCutiUmum || 0,

hariBiasa:data.hariBiasa || [],

malam:data.malam || [],

cutiUmum:data.cutiUmum || [],

keluarNegeri:data.keluarNegeri || []

};

}

function selamatAtributTuntutan(value){
  return String(value ?? "").replace(/[&<>"']/g, function(huruf){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[huruf];
  });
}

function butangCetakResitSJAM(x){

  if(
    !x.diterimaDari &&
    !x.wangPerkataan &&
    !x.dari &&
    !x.ke &&
    !x.tujuan
  ){
    return "";
  }

  const dataResit = encodeURIComponent(
    JSON.stringify({
      tarikh: x.tarikh || "",
      resit: x.resit || "",
      jumlah: x.jumlah || "",
      diterimaDari: x.diterimaDari || "",
      wangPerkataan: x.wangPerkataan || "",
      dari: x.dari || "",
      ke: x.ke || "",
      tujuan: x.tujuan || ""
    })
  );

  return `
    <button
      type="button"
      class="noPrint"
      data-resit-cetak="${selamatAtributTuntutan(dataResit)}"
      onclick="cetakResitRasmiSJAM(this)"

async function padamTuntutan(button){

  if(button.disabled){
    return;
  }

  const idTuntutan = button.dataset.idTuntutan;
  const idKrew = button.dataset.idKrew;

  if(!confirm(
    "Padam tuntutan ini?\n\n" +
    "No Resit: " + (button.dataset.resit || "-") + "\n" +
    "Tarikh: " + (button.dataset.tarikh || "-") + "\n\n" +
    "Rekod ini juga akan dipadam daripada Google Sheet."
  )){
    return;
  }

  const username = prompt("Username admin:");

  if(username === null || !username.trim()){
    return;
  }

  const password = prompt(
    "Password admin (teks akan kelihatan):"
  );

  if(password === null || !password){
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Memadam...";

  try {
    const response = await fetch(SCRIPT_URL, {
      method:"POST",
      body:JSON.stringify({
        action:"padamTuntutan",
        idTuntutan:idTuntutan,
        idKrew:idKrew,
        username:username.trim(),
        password:password
      })
    });

    if(!response.ok){
      throw new Error("Permintaan gagal.");
    }

    const res = await response.json();

    if(!res.success){
      alert("❌ " + (res.message || "Tuntutan gagal dipadam."));
      return;
    }

    alert("✅ Tuntutan berjaya dipadam daripada Google Sheet.");

    laporanKrew(idKrew);

  } catch(error){
    console.error(error);

    alert(
      "❌ Status pemadaman tidak dapat dipastikan. " +
      "Buka semula laporan untuk menyemak sebelum mencuba lagi."
    );

  } finally {
    button.disabled = false;
    button.textContent = "🗑️ Padam";
  }
}

function testSiren(){

let audioCtx = audioCtxGlobal;

if(!audioCtx){

return;

}

let startTime = audioCtx.currentTime;

function beep(time, frequency){

let osc = audioCtx.createOscillator();

let gain = audioCtx.createGain();

osc.type = "square";

osc.frequency.value = frequency;

gain.gain.value = 0.3;

osc.connect(gain);

gain.connect(audioCtx.destination);

osc.start(time);

osc.stop(time + 0.25);

}

for(let i=0;i<20;i++){

let time = startTime + (i * 0.25);

let freq = (i % 2 === 0) ? 900 : 500;

beep(time,freq);

}

}

// ==============================
// CARI DAN TAPIS RESIT
// ==============================

function tapisPusatResitSJAM(){

  const carian = (
    document.getElementById("cariResitSJAM")?.value || ""
  ).trim().toLowerCase();

  const tahun =
    document.getElementById("tahunResitSJAM")?.value || "";

  const bulan =
    document.getElementById("bulanResitSJAM")?.value || "";

  const hasil = arkibResitSJAM.filter(x=>{

    const teks = [
      x.resit,
      x.namaKrew,
      x.diterimaDari,
      x.dari,
      x.ke,
      x.tujuan
    ].join(" ").toLowerCase();

    const tarikh = String(x.tarikh || "");

    return (
      teks.includes(carian) &&
      (!tahun || tarikh.slice(0,4) === tahun) &&
      (!bulan || tarikh.slice(5,7) === bulan)
    );

  });

  document.getElementById("jumlahResitSJAM")
    .textContent = hasil.length;

  const kawasan =
    document.getElementById("senaraiResitSJAM");

  kawasan.innerHTML = "";

  if(hasil.length === 0){

    kawasan.textContent = "Tiada resit ditemui.";
    return;

  }

  hasil.forEach(x=>{

    const kotak = document.createElement("div");

    kotak.className = "sejarahItem";
    kotak.style.textAlign = "left";

    const tarikh = /^\d{4}-\d{2}-\d{2}$/.test(x.tarikh)
      ? x.tarikh.slice(8,10) + "/" +
        x.tarikh.slice(5,7) + "/" +
        x.tarikh.slice(0,4)
      : "-";

    const jumlah = Number(x.jumlah);

    const teks = document.createElement("div");

    teks.style.whiteSpace = "pre-line";
    teks.style.overflowWrap = "anywhere";

    teks.textContent =
  "🧾 No. Resit: " + (x.resit || "-") + "\n" +
  "📅 Tarikh: " + tarikh + "\n" +
  "👤 Nama Waris: " + (x.diterimaDari || "-") + "\n" +
  "📍 Dari: " + (x.dari || "-") + "\n" +
  "📍 Ke: " + (x.ke || "-") + "\n" +
  "📝 Tujuan: " + (x.tujuan || "-") + "\n" +
  "💰 RM " + (
    Number.isFinite(jumlah)
      ? jumlah.toFixed(2)
      : "-"
  );
    const butang = document.createElement("button");

    butang.type = "button";
    butang.textContent = "🖨️ Cetak Semula Resit";

    butang.onclick = function(){

      const dataCetak = {
        tarikh:x.tarikh,
        resit:x.resit,
        jumlah:x.jumlah,
        diterimaDari:x.diterimaDari,
        wangPerkataan:x.wangPerkataan,
        dari:x.dari,
        ke:x.ke,
        tujuan:x.tujuan
      };

      const butangSementara =
        document.createElement("button");

      butangSementara.dataset.resitCetak =
        encodeURIComponent(
          JSON.stringify(dataCetak)
        );

      cetakResitRasmiSJAM(butangSementara);

    };

    kotak.appendChild(teks);
    kotak.appendChild(butang);
    kawasan.appendChild(kotak);

  });

}

// LOCALSTORAGE SAHAJA
// ========================================

const KUNCI_JADUAL_AMBULANS_SJAM =
  "jadualAmbulansSJAM";

// Ambil semua jadual yang telah disimpan
function ambilSemuaJadualAmbulansSJAM(){

  try {

    const simpanan = localStorage.getItem(
      KUNCI_JADUAL_AMBULANS_SJAM
    );

    const data = simpanan
      ? JSON.parse(simpanan)
      : [];

    return Array.isArray(data) ? data : [];

  } catch(error){

    console.error(
      "Ralat membaca jadual SJAM:",
      error
    );

    return null;

  }

}

// Simpan satu jadual harian
function simpanRekodJadualAmbulansSJAM(jadual){

  if(!jadual || !jadual.tarikh){

    alert("❌ Sila pilih tarikh jadual.");
    return false;

  }

  const senarai = ambilSemuaJadualAmbulansSJAM();

  if(!senarai){

    alert(
      "❌ Data simpanan tidak dapat dibaca. " +
      "Tiada perubahan dibuat."
    );

    return false;

  }

  const indeks = senarai.findIndex(
    item => item.tarikh === jadual.tarikh
  );

  if(indeks >= 0){

    senarai[indeks] = jadual;

  }else{

    senarai.push(jadual);

  }

  try {

    localStorage.setItem(
      KUNCI_JADUAL_AMBULANS_SJAM,
      JSON.stringify(senarai)
    );

    return true;

  }catch(error){

    console.error(
      "Ralat menyimpan jadual SJAM:",
      error
    );

    alert(
      "❌ Jadual gagal disimpan. " +
      "Sila semak ruang storan pelayar."
    );

    return false;

  }

}

// Dapatkan jadual berdasarkan tarikh
function cariJadualAmbulansSJAM(tarikh){

  const senarai = ambilSemuaJadualAmbulansSJAM();

  if(!senarai){
    return null;
  }

  return senarai.find(
    item => item.tarikh === tarikh
  ) || null;

}


// ========================================
// SAVE JADUAL AMBULANS SERVICE SJAM
// LOCALSTORAGE SAHAJA
// ========================================

function simpanJadualBaharuSJAM(){

  // Ambil semua maklumat borang
  const data = kumpulJadualBaharuSJAM();

  // Semak hari dan tarikh
  if(!data.hari || !data.tarikh){

    alert(
      "❌ Sila pilih Hari dan Tarikh Bertugas."
    );

    return;

  }

  // Pastikan hari sepadan dengan tarikh
  const namaHari = [
    "Ahad",
    "Isnin",
    "Selasa",
    "Rabu",
    "Khamis",
    "Jumaat",
    "Sabtu"
  ];

  const pecahan = data.tarikh
    .split("-")
    .map(Number);

  if(
    pecahan.length !== 3 ||
    pecahan.some(n => !Number.isInteger(n))
  ){

    alert("❌ Format tarikh tidak sah.");
    return;

  }

  const tarikhSemak = new Date(
    pecahan[0],
    pecahan[1] - 1,
    pecahan[2]
  );

  if(
    tarikhSemak.getFullYear() !== pecahan[0] ||
    tarikhSemak.getMonth() !== pecahan[1] - 1 ||
    tarikhSemak.getDate() !== pecahan[2]
  ){

    alert("❌ Tarikh tidak sah.");
    return;

  }

  if(namaHari[tarikhSemak.getDay()] !== data.hari){

    alert(
      "❌ Hari tidak sepadan dengan tarikh.\n" +
      "Sila semak pilihan Hari & Tarikh."
    );

    return;

  }

  // Semak sekurang-kurangnya satu kes
  if(!data.kes || data.kes.length === 0){

    alert(
      "❌ Sila masukkan sekurang-kurangnya satu kes."
    );

    return;

  }

  // Semak maklumat wajib setiap kes
  for(let i = 0; i < data.kes.length; i++){

    const kes = data.kes[i];

    if(
      !kes.masa ||
      !kes.krew.length ||
      !kes.pesakit ||
      !kes.dari ||
      !kes.ke ||
      !kes.tujuan ||
      !kes.ambulans ||
      kes.harga === ""
    ){

      alert(
        "❌ Sila lengkapkan maklumat KES " +
        (i + 1) +
        ".\n\n" +
        "Masa, Krew, Pesakit, Dari, Ke, " +
        "Tujuan, Ambulans dan Harga diperlukan."
      );

      return;

    }

    if(
      !Number.isFinite(Number(kes.harga)) ||
      Number(kes.harga) < 0
    ){

      alert(
        "❌ Harga KES " +
        (i + 1) +
        " tidak sah."
      );

      return;

    }

  }

  // Semak jadual sedia ada
  const senaraiLama =
    ambilSemuaJadualAmbulansSJAM();

  if(senaraiLama === null){

    alert(
      "❌ Simpanan lama tidak dapat dibaca.\n" +
      "Jadual tidak disimpan."
    );

    return;

  }

  const rekodLama = senaraiLama.find(
    item => item.tarikh === data.tarikh
  );

  if(rekodLama){

    const setuju = confirm(
      "⚠️ Jadual untuk " +
      data.tarikh +
      " sudah wujud.\n\n" +
      "Adakah anda mahu menggantikan " +
      "jadual lama dengan jadual ini?"
    );

    if(!setuju){
      return;
    }

  }

  // Simpan metadata kemas kini
  data.dikemasKini =
    new Date().toISOString();

  // Simpan menggunakan fungsi sedia ada
  const berjaya =
    simpanRekodJadualAmbulansSJAM(data);

  if(!berjaya){
    return;
  }

  alert(
    "✅ JADUAL BERJAYA DISIMPAN!\n\n" +
    "Hari: " + data.hari + "\n" +
    "Tarikh: " + data.tarikh + "\n" +
    "Jumlah Kes: " + data.kes.length +
    "\n\n" +
    "Simpanan: localStorage"
  );

}

function isiSemulaJadualEditSJAM(jadual){

  isi("tarikhJadualSJAM",jadual.tarikh);

  function pilihKrew(namaInput,senarai){

      return;

      'input[name="'+namaInput+'"]'
    ).forEach(checkbox=>{

  kawasan.innerHTML = "";

    ? jadual.kes
    : [];

  kes.forEach(x=>{

    tambahKesBaharuSJAM();

    isi("masaKesSJAM"+n,x.masa);
    isi("pesakitKesSJAM"+n,x.pesakit);
    isi("dariKesSJAM"+n,x.dari);
    isi("keKesSJAM"+n,x.ke);
    isi("tujuanKesSJAM"+n,x.tujuan);
    isi("ambulansKesSJAM"+n,x.ambulans);
    isi("hargaKesSJAM"+n,x.harga);
    isi("donatKesSJAM"+n,x.donat);

    pilihKrew("krewKes"+n,x.krew);

  if(kes.length === 0){

// ==========================================
// PADAM REKOD JADUAL AMBULANS SERVICE
// LOCALSTORAGE SAHAJA
// ==========================================

function padamJadualAmbulansSJAM(tarikh){

  // Semak tarikh yang diterima
  if(!tarikh){
    alert("❌ Tarikh jadual tidak sah.");
    return;
  }

  // Ambil rekod daripada localStorage
  const senarai = ambilSemuaJadualAmbulansSJAM();

  if(senarai === null){
    alert("❌ Gagal membaca rekod jadual.");
    return;
  }

  // Pastikan jadual wujud
  const jadual = senarai.find(
    item => item.tarikh === tarikh
  );

  if(!jadual){
    alert("❌ Jadual tidak dijumpai.");
    return;
  }

  // Minta pengesahan admin
  const setuju = confirm(
    "⚠️ PADAM JADUAL AMBULANS?\n\n" +
    "Hari: " + (jadual.hari || "-") + "\n" +
    "Tarikh: " +
    formatTarikhJadualSJAM(tarikh) + "\n\n" +
    "Semua kes dan jadual syif bagi " +
    "tarikh ini akan dipadam.\n\n" +
    "Tindakan ini tidak boleh dibatalkan.\n\n" +
    "Teruskan?"
  );

  if(!setuju){
    return;
  }

  // Buang rekod bagi tarikh dipilih sahaja
  const senaraiBaharu = senarai.filter(
    item => item.tarikh !== tarikh
  );

  try{

    // Simpan semula rekod yang tinggal
    localStorage.setItem(
      KUNCI_JADUAL_AMBULANS_SJAM,
      JSON.stringify(senaraiBaharu)
    );

    alert(
      "✅ JADUAL BERJAYA DIPADAM!\n\n" +
      "Tarikh: " +
      formatTarikhJadualSJAM(tarikh)
    );

    // Segarkan paparan rekod
    lihatRekodJadualAmbulansSJAM();

  }catch(error){

    console.error(
      "Ralat padam jadual SJAM:",
      error
    );

    alert(
      "❌ Jadual gagal dipadam.\n" +
      "Tiada perubahan berjaya disimpan."
    );

  }

}

// ZON WAKTU MALAYSIA
// ==========================================

function tarikhEsokMalaysiaSJAM(){

  const sekarang = new Date();

  const bahagian = new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Asia/Kuala_Lumpur",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).formatToParts(sekarang);

  const tahun = Number(
    bahagian.find(x => x.type === "year").value
  );

  const bulan = Number(
    bahagian.find(x => x.type === "month").value
  );

  const hari = Number(
    bahagian.find(x => x.type === "day").value
  );

  // Tambah satu hari mengikut tarikh Malaysia
  const esok = new Date(
    Date.UTC(tahun, bulan - 1, hari + 1, 12)
  );

  return new Intl.DateTimeFormat(
    "ms-MY",
    {
      timeZone:"UTC",
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    }
  ).format(esok);

}

// FUNGSI SALIN TEKS

async function salinTeksPollStatusSJAM(teks){

  if(!teks){
    alert("❌ Teks tidak dijumpai.");
    return;
  }

  try {

    if(navigator.clipboard &&
       window.isSecureContext){

      await navigator.clipboard.writeText(teks);

    }else{

      throw new Error("Clipboard tidak tersedia.");

    }

    alert(
      "✅ Berjaya disalin!\n\n" +
      "Sila Paste ke WhatsApp Poll."
    );

  }catch(error){

    const textarea =
      document.createElement("textarea");

    textarea.value = teks;

    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.select();

    const berjaya =
      document.execCommand("copy");

    textarea.remove();

    if(berjaya){

      alert(
        "✅ Berjaya disalin!\n\n" +
        "Sila Paste ke WhatsApp Poll."
      );

    }else{

      alert("❌ Gagal menyalin teks.");

    }

  }

}

// ======================================================
// KIRA JUMLAH PERBELANJAAN DAN BAKI TRANSAKSI
// ======================================================

function kiraJumlahKewanganSJAM(){

  const baca = id => {

    const nilai = document.getElementById(id)?.value;

    if(nilai === "" || nilai === null || nilai === undefined){
      return 0;
    }

    return Number(nilai);

  };

  const minyak = baca("kwMinyak");
  const makan = baca("kwMakan");
  const lain = baca("kwLain");
  const penginapan = baca("kwPenginapan");
  const pendapatan = baca("kwPendapatan");

  const jumlah =
    minyak + makan + lain + penginapan;

  const baki = pendapatan - jumlah;

  const papar = (id,nilai)=>{

    const box = document.getElementById(id);

    if(box){
      box.textContent = formatRMKewanganSJAM(nilai);
    }

  };

  papar("kwJumlahBelanja",jumlah);

  papar("kwBakiTransaksi",baki);

}



// ======================================================
// SIMPAN / EDIT REKOD KEWANGAN SJAM
// ======================================================

async function simpanKewanganHTMLSJAM(){

  const token = localStorage.getItem(
    "tokenAdminSJAM"
  );

  if(!token){

    alert("❌ Sesi admin tamat. Sila login semula.");
    return;

  }

  const ambil = id =>
    document.getElementById(id)?.value.trim() || "";

  const sedangEdit = Boolean(
    idKewanganSedangEditSJAM
  );

  const data = {

    tarikh:ambil("kwTarikh"),

    pendapatan:ambil("kwPendapatan"),

    minyak:ambil("kwMinyak"),

    makanMinum:ambil("kwMakan"),

    lainLain:ambil("kwLain"),

    penginapan:ambil("kwPenginapan"),

    noResit:ambil("kwNoResit"),

    dari:ambil("kwDari"),

    ke:ambil("kwKe"),

    tujuan:ambil("kwTujuan"),

    kaedahPembayaran:ambil("kwKaedah")

  };

  // ID UNTUK EDIT SAHAJA
  if(sedangEdit){

    data.idKewangan = idKewanganSedangEditSJAM;

  }

  if(!data.tarikh){

    alert("❌ Sila pilih tarikh transaksi.");
    return;

  }

  const nilai = [
    data.pendapatan,
    data.minyak,
    data.makanMinum,
    data.lainLain,
    data.penginapan
  ];

  if(nilai.every(x=>x==="")){

    alert("❌ Sila masukkan sekurang-kurangnya satu nilai kewangan.");
    return;

  }

  if(nilai.some(x=>
    x!=="" &&
    (!Number.isFinite(Number(x)) || Number(x)<0)
  )){

    alert("❌ Nilai kewangan tidak sah.");
    return;

  }

  if(!data.kaedahPembayaran){

    alert("❌ Sila pilih Tunai atau Bank In.");
    return;

  }

  const tindakan = sedangEdit
    ? "editKewangan"
    : "simpanKewangan";

  const pengesahan = sedangEdit
    ? "Kemaskini rekod kewangan ini?"
    : "Simpan rekod kewangan baharu?";

  if(!confirm(pengesahan)){
    return;
  }

  const butang = document.getElementById(
    "btnSimpanKewanganSJAM"
  );

  butang.disabled = true;

  butang.textContent = sedangEdit
    ? "⏳ SEDANG MENGEMASKINI..."
    : "⏳ SEDANG MENYIMPAN...";

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:tindakan,

        tokenAdmin:token,

        data:data

      })

    });

    const res = await response.json();

    if(!res.success){

      throw new Error(
        res.message || "Operasi gagal."
      );

    }

    alert(
      sedangEdit
      ? "✅ REKOD BERJAYA DIKEMASKINI!"
      : "✅ REKOD BERJAYA DISIMPAN!"
    );

    // RESET MOD EDIT
    idKewanganSedangEditSJAM = "";

    // KOSONGKAN BORANG
    kosongkanBorangKewanganSJAM();

    // KEMBALIKAN PAPARAN BUTANG
    butang.textContent =
      "💾 SIMPAN REKOD KEWANGAN";

    // BUANG BUTANG BATAL EDIT JIKA ADA
    const butangBatal = document.getElementById(
      "btnBatalEditKewanganSJAM"
    );

    if(butangBatal){
      butangBatal.remove();
    }

    // KEMASKINI RINGKASAN DAN SEJARAH
    await muatKewanganSJAM();

  }catch(error){

    console.error(error);

    alert("❌ " + error.message);

  }finally{

    butang.disabled = false;

    if(idKewanganSedangEditSJAM){

      butang.textContent =
        "✏️ KEMASKINI REKOD KEWANGAN";

    }else{

      butang.textContent =
        "💾 SIMPAN REKOD KEWANGAN";

    }

  }

}


// ======================================================
// KOSONGKAN BORANG KEWANGAN
// ======================================================

function kosongkanBorangKewanganSJAM(){

  const medan = [
    "kwPendapatan",
    "kwNoResit",
    "kwDari",
    "kwKe",
    "kwTujuan"
  ];

  medan.forEach(id=>{

    const el = document.getElementById(id);

    if(el){
      el.value = "";
    }

  });

  [
    "kwMinyak",
    "kwMakan",
    "kwLain",
    "kwPenginapan"
  ].forEach(id=>{

    const el = document.getElementById(id);

    if(el){
      el.value = "0";
    }

  });

  const tarikh = document.getElementById("kwTarikh");

  if(tarikh){
    tarikh.value = tarikhHariIniKewanganSJAM();
  }

  const kaedah = document.getElementById("kwKaedah");

  if(kaedah){
    kaedah.value = "";
  }

  kiraJumlahKewanganSJAM();

}

// BATAL MOD EDIT
// ======================================================

function batalEditKewanganSJAM(){

  if(!confirm("Batalkan proses edit rekod ini?")){
    return;
  }

  idKewanganSedangEditSJAM = "";

  kosongkanBorangKewanganSJAM();

  const butang = document.getElementById(
    "btnSimpanKewanganSJAM"
  );

  if(butang){

    butang.textContent =
      "💾 SIMPAN REKOD KEWANGAN";

  }

  const butangBatal = document.getElementById(
    "btnBatalEditKewanganSJAM"
  );

  if(butangBatal){
    butangBatal.remove();
  }

  alert("✅ Mod edit dibatalkan.");

}

      formatRMKewanganSJAM(res.keseluruhan.pendapatan);

    ).textContent =
      formatRMKewanganSJAM(res.keseluruhan.perbelanjaan);

    ).textContent =
      formatRMKewanganSJAM(res.keseluruhan.baki);

    
dataKewanganSemasaSJAM = res.data || [];

paparSenaraiKewanganSJAM(dataKewanganSemasaSJAM);

paparAnalisisKewanganSJAM(res);

      formatRMKewanganSJAM(x.minyak) + "\n" +

      "🍽️ Makan/Minum: " +
      formatRMKewanganSJAM(x.makanMinum) + "\n" +

      formatRMKewanganSJAM(x.lainLain) + "\n" +

      "🏨 Penginapan: " +

      "📉 Jumlah Perbelanjaan: " +

    kotak.appendChild(teks);

    // RUANG BUTANG
    const butangBox = document.createElement("div");

    butangBox.style.display = "grid";
    butangBox.style.gridTemplateColumns = "1fr 1fr 1fr";
    butangBox.style.gap = "7px";
    butangBox.style.marginTop = "15px";

    // FUNGSI CIPTA BUTANG
    function ciptaButang(teks,warna,aksi){

      const butang = document.createElement("button");

      butang.type = "button";
      butang.textContent = teks;
      butang.style.background = warna;
      butang.style.padding = "11px 3px";
      butang.style.marginTop = "0";
      butang.style.fontSize = "13px";
      butang.style.fontWeight = "bold";

      butangBox.appendChild(butang);

    }

    // VIEW
    ciptaButang(
      "👁️ VIEW",
      "#1565c0",
      ()=>viewKewanganHTMLSJAM(x.idKewangan)
    );

    // EDIT
    ciptaButang(
      "✏️ EDIT",
      "#ef6c00",
      ()=>editKewanganHTMLSJAM(x.idKewangan)
    );

    // PADAM
    ciptaButang(
      "🗑️ PADAM",
      "#c62828",
      ()=>padamKewanganHTMLSJAM(x.idKewangan)
    );

    kotak.appendChild(butangBox);

    kawasan.appendChild(kotak);

  });

}

async function editKewanganHTMLSJAM(id){

  }

  if(idKewanganSedangEditSJAM){

      "Anda sedang mengedit rekod lain. Batalkan edit lama?"
    )){

    }

    idKewanganSedangEditSJAM = "";

  }

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"viewKewangan",

        tokenAdmin:token,

        idKewangan:id

      })

    });

    const res = await response.json();

    if(!res.success){

      throw new Error(res.message);

    }

    const x = res.data;

    // SIMPAN ID REKOD ASAL
    idKewanganSedangEditSJAM = x.idKewangan;

    isi("kwPenginapan",x.penginapan);

    isi("kwNoResit",x.noResit);

    isi("kwDari",x.dari);

    isi("kwKe",x.ke);

    isi("kwTujuan",x.tujuan);

    document.getElementById(
      "btnBatalEditKewanganSJAM"
    )?.remove();

    const batal = document.createElement("button");

    batal.type = "button";

    batal.id = "btnBatalEditKewanganSJAM";

    batal.className = "back";

    batal.textContent = "❌ BATAL EDIT";

// ======================================================
// ANALISIS KEWANGAN AUTOMATIK SJAM
// ======================================================

function paparAnalisisKewanganSJAM(res){

  const graf = document.getElementById(
    "kwGrafPerbelanjaanSJAM"
  );

  const pecahan = document.getElementById(
    "kwPecahanKategoriSJAM"
  );

  if(!graf || !pecahan){
    return;
  }

  const data = Array.isArray(res.data)
    ? res.data
    : [];

  const ringkasan = res.ringkasan || {};

  const pendapatan = Number(
    ringkasan.pendapatan
  ) || 0;

  const perbelanjaan = Number(
    ringkasan.perbelanjaan
  ) || 0;

  const baki = Number(
    ringkasan.baki
  ) || 0;

  // JUMLAH SETIAP KATEGORI
  const kategori = [

    {
      nama:"Minyak",
      nilai:data.reduce(
        (jumlah,x)=>jumlah+(Number(x.minyak)||0),0
      ),
      warna:"#1565c0",
      emoji:"⛽"
    },

    {
      nama:"Makan / Minum",
      nilai:data.reduce(
        (jumlah,x)=>jumlah+(Number(x.makanMinum)||0),0
      ),
      warna:"#ef6c00",
      emoji:"🍽️"
    },

    {
      nama:"Lain-lain",
      nilai:data.reduce(
        (jumlah,x)=>jumlah+(Number(x.lainLain)||0),0
      ),
      warna:"#7b1fa2",
      emoji:"📦"
    },

    {
      nama:"Penginapan",
      nilai:data.reduce(
        (jumlah,x)=>jumlah+(Number(x.penginapan)||0),0
      ),
      warna:"#00897b",
      emoji:"🏨"
    }

  ];

  const jumlahKategori = kategori.reduce(
    (jumlah,x)=>jumlah+x.nilai,0
  );

  const tempohBulan = document.getElementById(
    "bulanKewanganSJAM"
  )?.value || "";

  const tempohTahun = document.getElementById(
    "tahunKewanganSJAM"
  )?.value || "";

  const papar = (id,nilai)=>{

    const el = document.getElementById(id);

    if(el){
      el.textContent = formatRMKewanganSJAM(nilai);
    }

  };

  // PAPAR TEMPOH
  document.getElementById(
    "kwTempohAnalisis"
  ).textContent = tempohBulan+" "+tempohTahun;

  // PAPAR JUMLAH
  papar("kwAnalisisPendapatan",pendapatan);

  papar("kwAnalisisPerbelanjaan",perbelanjaan);

  papar("kwAnalisisBaki",baki);

  // PERATUS PERBELANJAAN
  const peratus = pendapatan > 0
    ? (perbelanjaan/pendapatan)*100
    : 0;

  document.getElementById(
    "kwAnalisisPeratus"
  ).textContent =
    "Penggunaan pendapatan: "+peratus.toFixed(1)+"%";

  // GRAF PERBELANJAAN
  graf.innerHTML = "";

  kategori.forEach(item=>{

    const peratusKategori = jumlahKategori > 0
      ? (item.nilai/jumlahKategori)*100
      : 0;

    const baris = document.createElement("div");

    baris.style.marginBottom = "19px";

    const tajuk = document.createElement("div");

    tajuk.style.display = "flex";
    tajuk.style.justifyContent = "space-between";
    tajuk.style.gap = "8px";
    tajuk.style.marginBottom = "7px";
    tajuk.style.fontSize = "13px";

    const nama = document.createElement("b");
    nama.textContent = item.emoji+" "+item.nama;

    const jumlah = document.createElement("b");
    jumlah.textContent =
      formatRMKewanganSJAM(item.nilai);

    tajuk.appendChild(nama);
    tajuk.appendChild(jumlah);

    const latar = document.createElement("div");

    latar.style.background = "#eeeeee";
    latar.style.height = "17px";
    latar.style.borderRadius = "10px";
    latar.style.overflow = "hidden";

    const bar = document.createElement("div");

    bar.style.background = item.warna;
    bar.style.width = peratusKategori+"%";
    bar.style.height = "100%";
    bar.style.borderRadius = "10px";
    bar.style.transition = "width 0.5s";

    latar.appendChild(bar);

    const label = document.createElement("small");

    label.style.color = "#666";
    label.textContent =
      peratusKategori.toFixed(1)+"% daripada jumlah perbelanjaan";

    baris.appendChild(tajuk);
    baris.appendChild(latar);
    baris.appendChild(label);

    graf.appendChild(baris);

  });

  // PECAHAN KATEGORI
  pecahan.innerHTML = "";

  kategori.forEach(item=>{

    const baris = document.createElement("div");

    baris.style.display = "flex";
    baris.style.justifyContent = "space-between";
    baris.style.alignItems = "center";
    baris.style.padding = "12px 5px";
    baris.style.borderBottom = "1px solid #ddd";
    baris.style.gap = "8px";

    const nama = document.createElement("b");
    nama.textContent = item.emoji+" "+item.nama;

    const jumlah = document.createElement("b");
    jumlah.textContent =
      formatRMKewanganSJAM(item.nilai);

    baris.appendChild(nama);
    baris.appendChild(jumlah);

    pecahan.appendChild(baris);

  });

  // KESIMPULAN AUTOMATIK
  const kesimpulan = document.getElementById(
    "kwAnalisisKesimpulan"
  );

  if(pendapatan === 0 && perbelanjaan === 0){

    kesimpulan.textContent =
      "Belum terdapat rekod pendapatan atau perbelanjaan bagi tempoh yang dipilih.";

  }

  else if(baki > 0){

    kesimpulan.textContent =
      "✅ Kedudukan kewangan adalah positif. " +
      "Baki bersih bagi tempoh "+tempohBulan+
      " "+tempohTahun+" ialah "+
      formatRMKewanganSJAM(baki)+".";

  }

  else if(baki < 0){

    kesimpulan.textContent =
      "⚠️ Perbelanjaan melebihi pendapatan sebanyak "+
      formatRMKewanganSJAM(Math.abs(baki))+
      ". Sila semak kedudukan kewangan bagi tempoh ini.";

  }

  else{

    kesimpulan.textContent =
      "Kedudukan kewangan adalah seimbang. " +
      "Pendapatan dan perbelanjaan adalah sama.";

  }

}

// ======================================================
// CETAK / SIMPAN LAPORAN KEWANGAN SJAM
// FORMAT RASMI A4
// ======================================================

function cetakLaporanKewanganSJAM(){

  // SEMAK SESI ADMIN
  const token = localStorage.getItem(
    "tokenAdminSJAM"
  );

  if(!token){

    alert("❌ Sila login semula sebagai admin.");

    return;

  }

  // AMBIL PILIHAN BULAN DAN TAHUN
  const bulan = document.getElementById(
    "bulanKewanganSJAM"
  )?.value || "";

  const tahun = document.getElementById(
    "tahunKewanganSJAM"
  )?.value || "";

  // AMBIL DATA TRANSAKSI
  const data = dataKewanganSemasaSJAM;

  if(!Array.isArray(data) || data.length===0){

    alert(
      "❌ Tiada transaksi untuk laporan ini.\n\n" +
      "Sila pilih bulan dan tahun yang mempunyai rekod."
    );

    return;

  }

  // PASTIKAN DATA SEPADAN DENGAN PILIHAN
  const padanan = data.every(x=>
    String(x.bulan).toLowerCase() ===
      bulan.toLowerCase() &&
    String(x.tahun) === String(tahun)
  );

  if(!padanan){

    alert(
      "❌ Data laporan tidak sepadan dengan pilihan.\n\n" +
      "Sila tekan PAPAR KEWANGAN terlebih dahulu."
    );

    return;

  }

  // KIRA RINGKASAN DARIPADA REKOD
  const jumlah = {

    pendapatan:0,
    minyak:0,
    makan:0,
    lain:0,
    penginapan:0,
    perbelanjaan:0,
    baki:0

  };

  data.forEach(x=>{

    jumlah.pendapatan += Number(x.pendapatan)||0;

    jumlah.minyak += Number(x.minyak)||0;

    jumlah.makan += Number(x.makanMinum)||0;

    jumlah.lain += Number(x.lainLain)||0;

    jumlah.penginapan += Number(x.penginapan)||0;

    jumlah.perbelanjaan +=
      Number(x.jumlahPerbelanjaan)||0;

  });

  jumlah.baki =
    jumlah.pendapatan-jumlah.perbelanjaan;

  // FORMAT RM
  const rm = nilai=>
    "RM "+Number(nilai||0).toLocaleString(
      "en-MY",
      {
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }
    );

  // ESCAPE TEKS
  const esc = nilai=>
    String(nilai??"").replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]);

  // BUKA TETINGKAP CETAKAN
  const laporan = window.open(
    "",
    "_blank",
    "width=1100,height=850"
  );

  if(!laporan){

    alert(
      "❌ Pop-up disekat.\n\n" +
      "Sila benarkan pop-up untuk Web App SJAM."
    );

    return;

  }

  // JANA BARIS TRANSAKSI
  let baris = "";

  data.forEach((x,i)=>{

    const tarikh = x.tarikh
      ? x.tarikh.slice(8,10)+"/"+
        x.tarikh.slice(5,7)+"/"+
        x.tarikh.slice(0,4)
      : "-";

    baris += `

      <tr>

        <td>${i+1}</td>

        <td>${esc(tarikh)}</td>

        <td>${rm(x.pendapatan)}</td>

        <td>${rm(x.minyak)}</td>

async function muatLaporanTahunanSJAM(){

  const token = localStorage.getItem("tokenAdminSJAM");

  const tahun = document.getElementById(
    "kwTahunTahunanSJAM"
  )?.value;

  if(!token){
    alert("Sesi admin tamat.");
    return;
  }

  const graf = document.getElementById("kwGrafTahunanSJAM");

  graf.textContent = "⏳ Sedang mengambil data tahunan...";

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"senaraiKewangan",

        tokenAdmin:token,

        bulan:"",

        tahun:tahun

      })

    });

    const res = await response.json();

    if(!res.success){

      throw new Error(res.message || "Gagal mengambil data tahunan.");

    }

    dataLaporanTahunanSJAM = res.data || [];

    paparLaporanTahunanSJAM(res,tahun);

  }catch(error){

    console.error(error);

    graf.textContent = "❌ "+error.message;

    alert("❌ "+error.message);

  }

}

function paparLaporanTahunanSJAM(res,tahun){

  const data = res.data || [];

  const pendapatan = Number(
    res.ringkasan.pendapatan
  ) || 0;

  const belanja = Number(
    res.ringkasan.perbelanjaan
  ) || 0;

  const baki = Number(
    res.ringkasan.baki
  ) || 0;

  const rm = formatRMKewanganSJAM;

  document.getElementById(
    "kwTahunanPendapatan"
  ).textContent = rm(pendapatan);

  document.getElementById(
    "kwTahunanBelanja"
  ).textContent = rm(belanja);

  document.getElementById(
    "kwTahunanBaki"
  ).textContent = rm(baki);

  document.getElementById(
    "kwTahunanBilangan"
  ).textContent = data.length;


  // NAMA BULAN
  const bulan = [
    "Januari","Februari","Mac","April",
    "Mei","Jun","Julai","Ogos",
    "September","Oktober","November","Disember"
  ];

  const ringkasanBulan = bulan.map((nama,i)=>({

    nama:nama,

    pendapatan:0,

    belanja:0,

    baki:0

  }));


  // KUMPUL DATA MENGIKUT BULAN
  data.forEach(x=>{

    const tarikh = String(x.tarikh || "");

    const nomborBulan = Number(
      tarikh.substring(5,7)
    );

    if(nomborBulan<1 || nomborBulan>12){
      return;
    }

    const item = ringkasanBulan[nomborBulan-1];

    item.pendapatan += Number(x.pendapatan)||0;

    item.belanja += Number(x.jumlahPerbelanjaan)||0;

  });


  ringkasanBulan.forEach(x=>{

    x.baki = x.pendapatan-x.belanja;

  });


  // JADUAL 12 BULAN
  const jadual = document.getElementById(
    "kwJadualTahunanSJAM"
  );

  jadual.innerHTML = "";

  ringkasanBulan.forEach(x=>{

    const tr = document.createElement("tr");

    const nilai = [
      x.nama,
      rm(x.pendapatan),
      rm(x.belanja),
      rm(x.baki)
    ];

    nilai.forEach((v,i)=>{

      const td = document.createElement("td");

      td.textContent = v;

      td.style.padding = "9px 5px";

      td.style.borderBottom = "1px solid #ddd";

      td.style.textAlign = i===0?"left":"right";

      if(i===3){

        td.style.fontWeight = "bold";

        td.style.color = x.baki<0?"#c62828":"#2e7d32";

      }

      tr.appendChild(td);

    });

    jadual.appendChild(tr);

  });


  // GRAF PERBANDINGAN
  const graf = document.getElementById(
    "kwGrafTahunanSJAM"
  );

  graf.innerHTML = "";

  const maksimum = Math.max(
    1,
    ...ringkasanBulan.flatMap(x=>[
      x.pendapatan,
      x.belanja
    ])
  );

  ringkasanBulan.forEach(x=>{

    const baris = document.createElement("div");

    baris.style.marginBottom = "16px";
    baris.style.textAlign = "left";

    const tajuk = document.createElement("b");

    tajuk.textContent = x.nama;

    baris.appendChild(tajuk);

    [
      {
        nama:"Pendapatan",
        nilai:x.pendapatan,
        warna:"#2e7d32"
      },
      {
        nama:"Perbelanjaan",
        nilai:x.belanja,
        warna:"#c62828"
      }
    ].forEach(item=>{

      const label = document.createElement("div");

      label.style.display = "flex";
      label.style.justifyContent = "space-between";
      label.style.fontSize = "11px";
      label.style.marginTop = "5px";

      const nama = document.createElement("span");
      nama.textContent = item.nama;

      const jumlah = document.createElement("b");
      jumlah.textContent = rm(item.nilai);

      label.appendChild(nama);
      label.appendChild(jumlah);

      const latar = document.createElement("div");

      latar.style.background = "#eeeeee";
      latar.style.height = "10px";
      latar.style.borderRadius = "10px";
      latar.style.overflow = "hidden";

      const bar = document.createElement("div");

      bar.style.background = item.warna;
      bar.style.width =
        (item.nilai/maksimum*100)+"%";
      bar.style.height = "100%";

      latar.appendChild(bar);

      baris.appendChild(label);
      baris.appendChild(latar);

    });

    graf.appendChild(baris);

  });


  // PECAHAN PERBELANJAAN
  const kategori = [

    {
      nama:"Minyak",
      nilai:data.reduce((s,x)=>s+(Number(x.minyak)||0),0)
    },

    {
      nama:"Makan / Minum",
      nilai:data.reduce((s,x)=>s+(Number(x.makanMinum)||0),0)
    },

    {
      nama:"Lain-lain",
      nilai:data.reduce((s,x)=>s+(Number(x.lainLain)||0),0)
    },

    {
      nama:"Penginapan",
      nilai:data.reduce((s,x)=>s+(Number(x.penginapan)||0),0)
    }

  ];

  const pecahan = document.getElementById(
    "kwPecahanTahunanSJAM"
  );

  pecahan.innerHTML = "";

  kategori.forEach(x=>{

    const baris = document.createElement("div");

    baris.style.display = "flex";
    baris.style.justifyContent = "space-between";
    baris.style.padding = "10px 0";
    baris.style.borderBottom = "1px solid #ddd";

    const nama = document.createElement("b");
    nama.textContent = x.nama;

    const jumlah = document.createElement("span");
    jumlah.textContent = rm(x.nilai);

    baris.appendChild(nama);
    baris.appendChild(jumlah);

    pecahan.appendChild(baris);

  });


  // ANALISIS TAHUNAN
  const tertinggiPendapatan = [...ringkasanBulan]
    .sort((a,b)=>b.pendapatan-a.pendapatan)[0];

  const tertinggiBelanja = [...ringkasanBulan]
    .sort((a,b)=>b.belanja-a.belanja)[0];

  const analisis = document.getElementById(
    "kwAnalisisTahunanSJAM"
  );

  const peratus = pendapatan>0
    ? belanja/pendapatan*100
    : 0;

  analisis.textContent =

    "📅 Tahun laporan: "+tahun+"\n\n"+

    "💰 Jumlah pendapatan: "+rm(pendapatan)+"\n\n"+

    "📉 Jumlah perbelanjaan: "+rm(belanja)+"\n\n"+

    "💵 Baki bersih tahunan: "+rm(baki)+"\n\n"+

    "📊 Penggunaan pendapatan: "+peratus.toFixed(1)+"%\n\n"+

    "🏆 Bulan pendapatan tertinggi: "+
    tertinggiPendapatan.nama+
    " ("+rm(tertinggiPendapatan.pendapatan)+")\n\n"+

    "📉 Bulan perbelanjaan tertinggi: "+
    tertinggiBelanja.nama+
    " ("+rm(tertinggiBelanja.belanja)+")";

}

// CETAK LAPORAN TAHUNAN SJAM
// ======================================================

function cetakLaporanTahunanSJAM(){

  const tahun = document.getElementById(
    "kwTahunTahunanSJAM"
  )?.value;

  const data = dataLaporanTahunanSJAM;

  if(!Array.isArray(data) || data.length===0){

    alert("Tiada data untuk dicetak.");
    return;

  }

  if(!data.every(x=>String(x.tahun)===String(tahun))){

    alert("Sila papar semula laporan bagi tahun yang dipilih.");
    return;

  }

  const rm = formatRMKewanganSJAM;

  const jumlah = {

    pendapatan:data.reduce((s,x)=>s+(Number(x.pendapatan)||0),0),

    belanja:data.reduce((s,x)=>s+(Number(x.jumlahPerbelanjaan)||0),0)

  };

  jumlah.baki = jumlah.pendapatan-jumlah.belanja;

  const esc = nilai=>
    String(nilai??"").replace(/[&<>"']/g,c=>({
      "&":"&amp;","<":"&lt;",">":"&gt;",
      '"':"&quot;","'":"&#39;"
    })[c]);

  const bulan = [
    "Januari","Februari","Mac","April",
    "Mei","Jun","Julai","Ogos",

  ];

    "",
    "_blank",
    "width=1100,height=850"
  );

  if(!laporan){

    alert("Sila benarkan pop-up untuk mencetak laporan.");
    return;

  }

  const bulanan = bulan.map((nama,i)=>{

    const rekod = data.filter(x=>
      Number(String(x.tarikh).substring(5,7))===i+1
    );

    const pendapatan = rekod.reduce(
      (s,x)=>s+(Number(x.pendapatan)||0),0
    );

    const belanja = rekod.reduce(
      (s,x)=>s+(Number(x.jumlahPerbelanjaan)||0),0
    );

    return {nama,pendapatan,belanja,baki:pendapatan-belanja};

  });

  const barisBulanan = bulanan.map(x=>`

    <tr>
      <td>${x.nama}</td>
      <td>${rm(x.pendapatan)}</td>
      <td>${rm(x.belanja)}</td>
      <td>${rm(x.baki)}</td>
    </tr>

  `).join("");

  const barisTransaksi = data.map((x,i)=>{

    const tarikh = String(x.tarikh||"");

    return `

      <tr>

        <td>${i+1}</td>

        <td>${esc(tarikh.slice(8,10)+"/"+tarikh.slice(5,7)+"/"+tarikh.slice(0,4))}</td>

        <td>${rm(x.pendapatan)}</td>

        <td>${rm(x.jumlahPerbelanjaan)}</td>

        <td>${rm(x.bakiTransaksi)}</td>

        <td>${esc(x.noResit||"-")}</td>

      </tr>

    `;

  }).join("");

  laporan.document.open();

  laporan.document.write(`

    <!DOCTYPE html>

    <html lang="ms">

    <head>

      <meta charset="UTF-8">

      <title>Laporan Kewangan Tahunan ${esc(tahun)}</title>

      <style>

        @page{
          size:A4 landscape;

        }

        body{
          font-family:Arial,sans-serif;
          font-size:11px;
          color:#222;
        }

        h1,h2,h3{
          color:#123b65;
        }

        .header{
          text-align:center;
          border-bottom:3px double #123b65;
          padding-bottom:12px;
        }

        .ringkasan{
          display:grid;
          grid-template-columns:repeat(3,1fr);
          gap:12px;
          margin:20px 0;
        }

        .kotak{
          border:1px solid #ccc;
          padding:13px;
          text-align:center;
          border-radius:8px;
        }

        table{
          width:100%;
          border-collapse:collapse;
          margin:12px 0 25px;
        }

        th,td{
          border:1px solid #bbb;
          padding:7px;
          text-align:center;
        }

        th{
          background:#123b65;
          color:white;
        }

        tfoot{
          font-weight:bold;
          background:#e3f2fd;
        }

        .footer{
          margin-top:25px;
          border-top:1px solid #aaa;
          padding-top:12px;
        }

        .kawalan{
          text-align:center;
          margin:15px;
        }

        .kawalan button{
          padding:12px 25px;
          background:#1565c0;
          color:white;
          border:0;
          border-radius:8px;
        }

        @media print{
          .kawalan{display:none;}
          tr{break-inside:avoid;}
        }

      </style>

    </head>

    <body>

      <div class="kawalan">

        <button onclick="window.print()">
          🖨️ CETAK / SIMPAN PDF
        </button>

      </div>

      <div class="header">

        <h1>ST. JOHN AMBULANCE OF MALAYSIA</h1>

        <h2>SJAM KAWASAN KELANTAN UTARA</h2>

        <p>LAPORAN KEWANGAN TAHUNAN</p>

        <h2>${esc(tahun)}</h2>

      </div>

      <div class="ringkasan">

        <div class="kotak" style="background:#e8f5e9;">

          <b>JUMLAH PENDAPATAN</b>

          <h2>${rm(jumlah.pendapatan)}</h2>

        </div>

        <div class="kotak" style="background:#ffebee;">

          <b>JUMLAH PERBELANJAAN</b>

          <h2>${rm(jumlah.belanja)}</h2>

        </div>

        <div class="kotak" style="background:#e3f2fd;">

          <b>BAKI BERSIH TAHUNAN</b>

          <h2>${rm(jumlah.baki)}</h2>

        </div>

      </div>

      <h3>1. PERBANDINGAN KEWANGAN BULANAN</h3>

      <table>

        <thead>

          <tr>

            <th>Perbelanjaan</th>
            <th>Baki</th>
          </tr>

        <tbody>

async function viewSejarahKrew(button){

  const id = button.dataset.id;

  if(!currentUser || !id){
    alert("Sesi krew atau ID rekod tidak sah.");
    return;
  }

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"viewTuntutanKrew",

        idTuntutan:id,

        idKrew:currentUser.id

      })

    });

    const res = await response.json();

    if(!res.success){
      throw new Error(res.message);
    }

    const x = res.data;

    document.getElementById(
      "modalSejarahKrewSJAM"
    )?.remove();

    const modal = document.createElement("div");

    modal.id = "modalSejarahKrewSJAM";

    modal.style.cssText = `
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      z-index:99999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:15px;
    `;

    const kad = document.createElement("div");

    kad.style.cssText = `
      background:white;
      width:100%;
      max-width:450px;
      max-height:85vh;
      overflow-y:auto;
      padding:20px;
      border-radius:18px;
    `;

    const tajuk = document.createElement("h2");

    tajuk.textContent = "👁️ BUTIRAN TUNTUTAN";
    tajuk.style.color = "#1565c0";

    const butiran = document.createElement("div");

    butiran.style.cssText = `
      white-space:pre-line;
      line-height:1.8;
      overflow-wrap:anywhere;
      background:#f5f9ff;
      padding:15px;
      border-radius:12px;
    `;

    const tarikh = x.tarikh
      ? x.tarikh.split("-").reverse().join("/")
      : "-";

    butiran.textContent =

      "Jenis: " + x.jenis + "\n\n" +

      "Tarikh: " + tarikh + "\n\n" +

      "No Resit: " + (x.resit || "-") + "\n\n" +

      "Jumlah: " +
      (x.jumlah !== "" ? "RM " + x.jumlah : "-") + "\n\n" +

      "Destinasi: " + (x.destinasi || "-") + "\n\n" +

      "Pemandu: " + (x.pemandu || "-") + "\n\n" +

      "Diterima Oleh: " + (x.diterimaDari || "-") + "\n\n" +

      "Wang Perkataan: " + (x.wangPerkataan || "-") + "\n\n" +

      "Dari: " + (x.dari || "-") + "\n\n" +

      "Ke: " + (x.ke || "-") + "\n\n" +

      "Tujuan: " + (x.tujuan || "-");

    const tutup = document.createElement("button");

    tutup.textContent = "⬅️ TUTUP";
    tutup.className = "back";
    tutup.onclick = ()=>modal.remove();

    kad.appendChild(tajuk);
    kad.appendChild(butiran);
    kad.appendChild(tutup);

    modal.appendChild(kad);

    modal.onclick = e=>{
      if(e.target === modal){
        modal.remove();
      }
    };

    document.body.appendChild(modal);

  }catch(error){

    console.error(error);

    alert("❌ Gagal melihat rekod: " + error.message);

  }

}

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

        action:"viewTuntutanKrew",

        idTuntutan:id,

        idKrew:currentUser.id

      })

    });

    if(!res.success){
      throw new Error(res.message);
    }

    const x = res.data;

    document.getElementById(
      "modalEditSejarahKrewSJAM"
    )?.remove();

    const modal = document.createElement("div");

    modal.id = "modalEditSejarahKrewSJAM";

      inset:0;

      align-items:center;

      "Cuti Umum",
      "Keluar Negeri"
    ].map(jenis=>({

        ? jenis
        : paparJenis(jenis),

      label:jenis === "Keluar Negeri"
        ? jenis
        : paparJenis(jenis)

    }));

      });

    }

    const esc = selamatAtributTuntutan;

    modal.innerHTML = `

      <div style="
        background:white;

        >

        <select id="editPemanduKrewSJAM">

          <option value="">Pilih Pemandu</option>

          <option value="YA" ${x.pemandu === "YA" ? "selected" : ""}>

          </option>

          <option value="TIDAK" ${x.pemandu === "TIDAK" ? "selected" : ""}>

        <label>Wang Dalam Perkataan</label>

        <input

          value="${esc(x.wangPerkataan || "")}"
        >

        <label>Dari</label>

        <input

        >

        >

// ==================================================
// KEMASKINI WANG PERKATAAN KETIKA EDIT
// ==================================================

function kemasKiniWangEditKrewSJAM(){

  const jumlah = document.getElementById(
    "editJumlahKrewSJAM"
  )?.value;

  const wang = document.getElementById(
    "editWangKrewSJAM"
  );

  if(wang){

    wang.value =
      nomborKePerkataanSJAM(jumlah).toUpperCase();

  }

}


// ==================================================
// SIMPAN PERUBAHAN TUNTUTAN
// ==================================================

async function simpanEditSejarahKrew(id){

  if(!currentUser){
    alert("Sesi krew tidak sah.");
    return;
  }

  const ambil = id=>
    document.getElementById(id)?.value.trim() || "";

  const data = {

    idTuntutan:id,

    jenis:ambil("editJenisKrewSJAM"),

    tarikh:ambil("editTarikhKrewSJAM"),

    resit:ambil("editResitKrewSJAM"),

    jumlah:ambil("editJumlahKrewSJAM"),

    destinasi:ambil("editDestinasiKrewSJAM"),

    pemandu:ambil("editPemanduKrewSJAM"),

    diterimaDari:ambil("editDiterimaKrewSJAM"),

    wangPerkataan:ambil("editWangKrewSJAM"),

    dari:ambil("editDariKrewSJAM"),

    ke:ambil("editKeKrewSJAM"),

    tujuan:ambil("editTujuanKrewSJAM")

  };

  if(!data.tarikh || !data.jenis){

    alert("❌ Sila lengkapkan tarikh dan jenis tuntutan.");
    return;

  }

  if(data.jenis !== "Keluar Negeri"){

    if(
      !data.jumlah ||
      !data.diterimaDari ||
      !data.dari ||
      !data.ke ||
      !data.tujuan
    ){

      alert("❌ Sila lengkapkan semua maklumat tuntutan dan resit.");
      return;

    }

    data.wangPerkataan =
      nomborKePerkataanSJAM(data.jumlah).toUpperCase();

  }else{

    data.jumlah = "";

  }

  if(!confirm("Simpan perubahan rekod tuntutan ini?")){
    return;
  }

  const butang = document.getElementById(
    "btnSimpanEditSejarahSJAM"
  );

  if(butang){
    butang.disabled = true;
    butang.textContent = "⏳ MENYIMPAN...";
  }

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"editTuntutanKrew",

        idKrew:currentUser.id,

        data:data

      })

    });

    const res = await response.json();

    if(!res.success){
      throw new Error(res.message);
    }

    alert("✅ Rekod berjaya dikemaskini!");

    document.getElementById(
      "modalEditSejarahKrewSJAM"
    )?.remove();

    lihatSejarah();

  }catch(error){

    console.error(error);

    alert("❌ Gagal mengemaskini: " + error.message);

    if(butang){
      butang.disabled = false;
      butang.textContent = "💾 SIMPAN PERUBAHAN";
    }

  }

}

async function padamSejarahKrew(button){

  const id = button.dataset.id;

  const bulan = button.dataset.bulan;

  if(!currentUser || !id){
    alert("Sesi krew atau ID rekod tidak sah.");
    return;
  }

  if(!confirm(

    "⚠️ PADAM REKOD TUNTUTAN INI?\n\n" +

    "Rekod akan dipadam daripada:\n" +

    "1. Sejarah Saya\n" +

    "2. Google Sheet TUNTUTAN\n\n" +

    "Tindakan ini tidak boleh dibatalkan."

  )){
    return;
  }

  button.disabled = true;
  button.textContent = "⏳ Memadam...";

  try{

    const response = await fetch(SCRIPT_URL,{

      method:"POST",

      body:JSON.stringify({

        action:"padamTuntutanKrew",

        idTuntutan:id,

        idKrew:currentUser.id

      })

    });

    const res = await response.json();

    if(!res.success){
      throw new Error(res.message);
    }

    alert("✅ Rekod berjaya dipadam daripada Google Sheet!");

    lihatSejarah(bulan);

  }catch(error){

    console.error(error);

    alert("❌ Gagal memadam rekod: " + error.message);

    button.disabled = false;
    button.textContent = "🗑️ PADAM";

  }

}
